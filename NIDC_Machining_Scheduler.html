<script>
(function(){
  var steps=[[12,'Loading libraries'],[34,'Loading libraries'],[56,'Preparing the app'],
             [74,'Building the screen'],[88,'Almost there']],i=0;
  var bar=document.getElementById('boot-bar'), msg=document.getElementById('boot-msg');
  var iv=setInterval(function(){
    if(i>=steps.length){ clearInterval(iv); return; }
    if(bar) bar.style.width=steps[i][0]+'%';
    if(msg) msg.textContent=steps[i][1];
    i++;
  },700);
  window.__bootDone=function(){
    clearInterval(iv);
    var s=document.getElementById('boot-splash');
    if(!s) return;
    if(bar) bar.style.width='100%';
    s.style.transition='opacity .25s'; s.style.opacity='0';
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); },260);
  };
  /* safety: never trap the user behind the splash */
  setTimeout(function(){ if(window.__bootDone) window.__bootDone(); },25000);
})();
</script>

function typeOf(id){
  if(HAAS.includes(id))      return 'haas';
  if(LATHE.includes(id))     return 'lathe';
  if(DEBURR.includes(id))    return 'deburr';
  if(VIBRATORY.includes(id)) return 'vibratory';

}

function getMonday(ds){const d=new Date(ds+'T12:00:00'),day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day));return d.toISOString().slice(0,10);}
function getWeekDays(mon){const b=new Date(mon+'T12:00:00');return Array.from({length:6},(_,i)=>{const d=new Date(b);d.setDate(b.getDate()+i);return d.toISOString().slice(0,10);});}
function getPast3Days(){return Array.from({length:3},(_,i)=>{const d=new Date();d.setDate(d.getDate()-i-1);return d.toISOString().slice(0,10);});}

function resizeImg(file){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const M=800;let{width:w,height:h}=img;if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.75));};img.src=e.target.result;};r.readAsDataURL(file);});}

function StatusPill({value,onChange,t}){
  const cfg={running:{bg:'#dcfce7',c:'#16a34a',bc:'#86efac'},idle:{bg:'#f1f5f9',c:'#64748b',bc:'#cbd5e1'},maint:{bg:'#fee2e2',c:'#dc2626',bc:'#fca5a5'}};
  const s=cfg[value]||cfg.idle;
  return <select value={value} onChange={e=>onChange(e.target.value)} style={{fontSize:10,fontWeight:700,background:s.bg,color:s.c,border:`1px solid ${s.bc}`,borderRadius:20,padding:'3px 10px 3px 8px',cursor:'pointer',outline:'none',letterSpacing:'0.04em'}}>
    <option value="idle">{t.idle}</option>
    <option value="running">{t.running}</option>
    <option value="maint">{t.maint}</option>
  </select>;
}

function ProductionBar({actual,target,scrapped,onChange,color,t}){
  const pct=target>0?Math.min(100,Math.round(actual/target*100)):0;
  const barColor=pct>=100?'#22c55e':pct>=70?'#f59e0b':'#3b82f6';
  const scrapNum=parseInt(scrapped)||0;
  return(
    <div style={{background:'#f8fafc',border:'1.5px solid #e2e8f0',borderRadius:10,padding:'9px 10px',marginTop:2}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
        <span style={{fontSize:9,fontWeight:800,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.08em'}}>Production</span>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {scrapNum>0&&<span style={{fontSize:9,fontWeight:800,color:'#dc2626',background:'#fef2f2',padding:'1px 6px',borderRadius:5}}>🗑️ {scrapNum} scrap</span>}
          <span style={{fontSize:11,fontWeight:900,color:pct>0?barColor:'#e2e8f0'}}>{pct}%</span>
        </div>
      </div>
      <div style={{height:5,background:'#ffffff',borderRadius:10,overflow:'hidden',marginBottom:8}}>
        <div style={{height:'100%',width:`${pct}%`,background:barColor,borderRadius:10,transition:'width 0.4s'}}/>
      </div>
      {(actual>5000||scrapNum>5000)&&(
        <div style={{marginBottom:8,background:'#fef2f2',border:'1px solid #fca5a5',
          borderRadius:8,padding:'8px 10px',fontSize:10.5,color:'#b91c1c',lineHeight:1.45}}>
          <b>That number looks too high.</b> Did a part number go into the wrong box?
        </div>
      )}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6}}>
        <div>
          <div style={{fontSize:8,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:3}}>Target</div>
          <input type="number" min="0" value={target||''} placeholder="0"
            onChange={e=>onChange('partsTarget',parseInt(e.target.value)||0)}
            style={{width:'100%',padding:'5px 7px',fontSize:12,fontWeight:700,border:'1.5px solid #e2e8f0',borderRadius:7,background:'#fff',color:'#94a3b8',outline:'none'}}/>
        </div>
        <div>
          <div style={{fontSize:8,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:3}}>Made</div>
          <input type="number" min="0" value={actual||''} placeholder="0"
            onChange={e=>onChange('partsActual',parseInt(e.target.value)||0)}
            title={actual>5000?'That looks too high - did a part number go in this box?':''}
            style={{width:'100%',padding:'5px 7px',fontSize:12,fontWeight:700,border:`1.5px solid ${pct>0?barColor+'88':'#e2e8f0'}`,borderRadius:7,background:'#fff',color:pct>0?barColor:'#0f172a',outline:'none'}}/>
        </div>
        <div>
          <div style={{fontSize:8,color:'#dc2626',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:3,fontWeight:800}}>Scrap</div>
          <input type="number" min="0" value={scrapped||''} placeholder="0"
            onChange={e=>onChange('scrapped',parseInt(e.target.value)||0)}

}

        </div>
      </div>

  );
}

// ── Next-up queue strip shown at bottom of every machine card ─────────────
function NextJobQueue({upcomingJobs,tp,currentJob}){
  if(!upcomingJobs||upcomingJobs.length===0)return null;
  // Exclude the job currently running on this machine
  const jobs=upcomingJobs.filter(j=>!currentJob||(j.job_number!==currentJob)).slice(0,3);
  if(jobs.length===0)return null;
  const SHIFT_COLORS=['#d97706','#2563eb','#7c3aed'];
  const PRI_DOT={high:'#ef4444',medium:'#f59e0b',low:'#22c55e'};
  return(
    <div style={{borderTop:`1.5px dashed ${tp.border}`,marginTop:4,paddingTop:7}}>
      <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:6}}>
        <div style={{width:14,height:14,borderRadius:4,background:tp.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,fontWeight:900,color:'#fff',flexShrink:0}}>▶</div>
        <span style={{fontSize:8,fontWeight:900,color:tp.color,textTransform:'uppercase',letterSpacing:'0.1em'}}>Next Up · {jobs.length} job{jobs.length>1?'s':''}</span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {jobs.map((job,i)=>{
          const sc=SHIFT_COLORS[(job.planned_shift||1)-1];
          const pct=job.quantity>0?Math.min(100,Math.round((job.parts_done||0)/job.quantity*100)):0;
          const dateStr=job.planned_date?new Date(job.planned_date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
          return(
            <div key={job.id} style={{display:'flex',alignItems:'center',gap:5,background:i===0?tp.light:'#f8fafc',borderRadius:7,padding:'5px 7px',border:`1px solid ${i===0?tp.border:'#e2e8f0'}`}}>
              <div style={{width:14,height:14,borderRadius:'50%',background:i===0?tp.color:'#cbd5e1',display:'flex',alignItems:'center',justifyContent:'center',fontSize:7,fontWeight:900,color:'#fff',flexShrink:0}}>{i+1}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:1}}>
                  <span style={{fontFamily:'monospace',fontWeight:800,fontSize:9,color:i===0?tp.color:'#475569',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{job.job_number}</span>
                  {job.priority&&<div style={{width:5,height:5,borderRadius:'50%',background:PRI_DOT[job.priority]||'#94a3b8',flexShrink:0}}/>}
                </div>
                {job.part_name&&job.part_name!==job.job_number&&(
                  <div style={{fontSize:8,color:'#94a3b8',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{job.part_name}</div>
                )}
              </div>
              <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:2,flexShrink:0}}>
                {job.quantity>0&&<span style={{fontSize:8,fontWeight:700,color:'#64748b'}}>×{job.quantity}{pct>0?` (${pct}%)`:''}</span>}
                <div style={{display:'flex',gap:3,alignItems:'center'}}>
                  {dateStr&&<span style={{fontSize:7,color:'#94a3b8',fontWeight:600}}>{dateStr}</span>}
                  <span style={{fontSize:7,padding:'1px 4px',borderRadius:4,background:sc+'22',color:sc,fontWeight:800,border:`1px solid ${sc}44`}}>S{job.planned_shift||1}</span>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function renderLiveBar(live){
  var isRun=live.status==='running';
  var isAlarm=live.status==='alarm';
  var isIdle=live.status==='idle';
  var barColor=isRun?'#22c55e':isAlarm?'#ef4444':isIdle?'#eab308':'#94a3b8';
  var barBg=isRun?'#f0fdf4':isAlarm?'#fef2f2':isIdle?'#fefce8':'#f8fafc';
  var label=isRun?'RUNNING':isAlarm?'ALARM':isIdle?'IDLE':'OFFLINE';
  var oeeVal=live.oee||0;
  var aVal=Math.round((live.availability||0)*10)/10;
  var pVal=Math.round((live.performance||0)*10)/10;
  var qVal=Math.round((live.quality||0)*10)/10;
  var oeeColor=oeeVal>=85?'#16a34a':oeeVal>=65?'#d97706':'#dc2626';
  var aColor=aVal>=85?'#16a34a':aVal>=65?'#d97706':'#dc2626';
  var pColor=pVal>=85?'#16a34a':pVal>=65?'#d97706':'#dc2626';
  var qColor=qVal>=98?'#16a34a':qVal>=95?'#d97706':'#dc2626';
  var timeStr='';
  try{timeStr=live.last_update?new Date(live.last_update).toLocaleTimeString():'';}catch(e){}
  var prog=live.program&&live.program!=='-'&&live.program!=='null'?live.program:null;
  var alarmTxt=isAlarm&&live.alarm&&live.alarm!=='-'&&live.alarm.toUpperCase()!=='NO ACTIVE ALARMS'?live.alarm:null;
  var shiftPcs=live.parts_this_shift!=null?live.parts_this_shift:(live.parts_today||0);
  var todayPcs=live.parts_today||0;
  var scrap=live.scrap_parts||0;
  var shiftName=live.current_shift||'';
  var shiftShort=shiftName==='1st Shift'?'1ST':shiftName==='2nd Shift'?'2ND':shiftName==='3rd Shift'?'3RD':shiftName==='Off Hours'?'OFF':'--';
  var feedPct=live.avg_feed_pct||100;
  var feedColor=feedPct>=95?'#16a34a':feedPct>=80?'#d97706':'#dc2626';
  var downPct=live.down_pct||0;
  var idlePct=live.idle_pct||0;
  var setupPct=live.setup_pct||0;
  return(
    <div style={{borderTop:'3px solid '+barColor,background:barBg,padding:'8px 12px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:5}}>
        <div style={{display:'flex',alignItems:'center',gap:5}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:barColor,flexShrink:0}}/>
          <span style={{fontSize:10,fontWeight:900,color:barColor,textTransform:'uppercase',letterSpacing:.5}}>{label}</span>
          <span style={{fontSize:9,color:'#94a3b8',fontWeight:700,background:'#e2e8f0',padding:'1px 5px',borderRadius:4}}>LIVE</span>
          {shiftName&&<span style={{fontSize:9,color:'#7c3aed',fontWeight:800,background:'#ede9fe',padding:'1px 5px',borderRadius:4}}>{shiftShort+' SHIFT'}</span>}
        </div>
        <span style={{fontSize:9,color:'#94a3b8',fontFamily:'monospace'}}>{timeStr}</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:3,marginBottom:4}}>
        <div style={{textAlign:'center',background:'#faf5ff',borderRadius:6,padding:'4px 2px',border:'1px solid #e9d5ff'}}>
          <div style={{fontSize:14,fontWeight:900,color:'#7c3aed',lineHeight:1}}>{shiftPcs}</div>
          <div style={{fontSize:7,fontWeight:800,color:'#a78bfa',textTransform:'uppercase',marginTop:1}}>SHIFT PCS</div>
        </div>
        <div style={{textAlign:'center',background:'#eff6ff',borderRadius:6,padding:'4px 2px',border:'1px solid #bfdbfe'}}>
          <div style={{fontSize:14,fontWeight:900,color:'#2563eb',lineHeight:1}}>{todayPcs}</div>
          <div style={{fontSize:7,fontWeight:800,color:'#93c5fd',textTransform:'uppercase',marginTop:1}}>TODAY</div>
        </div>
        <div style={{textAlign:'center',background:'#f8fafc',borderRadius:6,padding:'4px 2px',border:'1px solid #e2e8f0'}}>
          <div style={{fontSize:14,fontWeight:900,color:'#0f172a',lineHeight:1}}>{live.avg_cycle_sec?Math.round(live.avg_cycle_sec)+'s':'--'}</div>
          <div style={{fontSize:7,fontWeight:800,color:'#94a3b8',textTransform:'uppercase',marginTop:1}}>CYCLE</div>
        </div>
        <div style={{textAlign:'center',background:'#fff7ed',borderRadius:6,padding:'4px 2px',border:'1px solid #fed7aa'}}>
          <div style={{fontSize:14,fontWeight:900,color:feedColor,lineHeight:1}}>{feedPct+'%'}</div>
          <div style={{fontSize:7,fontWeight:800,color:'#fdba74',textTransform:'uppercase',marginTop:1}}>FEED OVR</div>
        </div>
      </div>
      <div style={{background:'#ffffff',borderRadius:8,padding:'6px 8px',border:'1px solid #e2e8f0',marginBottom:3}}>
        <div style={{fontSize:8,fontWeight:800,color:'#64748b',textTransform:'uppercase',letterSpacing:.5,marginBottom:4}}>OEE = A x P x Q</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:4}}>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:14,fontWeight:900,color:oeeColor,lineHeight:1}}>{oeeVal+'%'}</div>
            <div style={{fontSize:7,fontWeight:800,color:'#94a3b8',marginTop:1}}>OEE</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:14,fontWeight:900,color:aColor,lineHeight:1}}>{aVal+'%'}</div>
            <div style={{fontSize:7,fontWeight:800,color:'#94a3b8',marginTop:1}}>AVAIL</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:14,fontWeight:900,color:pColor,lineHeight:1}}>{pVal+'%'}</div>
            <div style={{fontSize:7,fontWeight:800,color:'#94a3b8',marginTop:1}}>PERF</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:14,fontWeight:900,color:qColor,lineHeight:1}}>{qVal+'%'}</div>
            <div style={{fontSize:7,fontWeight:800,color:'#94a3b8',marginTop:1}}>QUAL</div>
          </div>
        </div>
        {(downPct>0||idlePct>0||setupPct>0)&&(
          <div style={{display:'flex',gap:4,marginTop:5,flexWrap:'wrap'}}>
            {downPct>0&&<span style={{fontSize:8,fontWeight:700,color:'#dc2626',background:'#fef2f2',padding:'1px 5px',borderRadius:4}}>{'Down:'+downPct+'%'}</span>}
            {setupPct>0&&<span style={{fontSize:8,fontWeight:700,color:'#d97706',background:'#fffbeb',padding:'1px 5px',borderRadius:4}}>{'Setup:'+setupPct+'%'}</span>}
            {idlePct>0&&<span style={{fontSize:8,fontWeight:700,color:'#64748b',background:'#f1f5f9',padding:'1px 5px',borderRadius:4}}>{'Idle:'+idlePct+'%'}</span>}
            {scrap>0&&<span style={{fontSize:8,fontWeight:700,color:'#7c3aed',background:'#faf5ff',padding:'1px 5px',borderRadius:4}}>{'Scrap:'+scrap+'pcs'}</span>}
          </div>
        )}
      </div>
      {prog&&<div style={{fontSize:9,color:'#475569',fontFamily:'monospace',fontWeight:700,padding:'2px 6px',borderRadius:4,background:'rgba(0,0,0,.05)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{'> '+prog}</div>}
      {alarmTxt&&<div style={{marginTop:3,fontSize:9,color:'#dc2626',fontWeight:800,background:'#fef2f2',padding:'2px 6px',borderRadius:4,border:'1px solid #fecaca'}}>{'! '+alarmTxt}</div>}
    </div>
  );
}

function PartSelect({value,parts,tp,t,onPick}){
  const[manual,setManual]=useState(false);
  const list=(parts||[]);
  const known=list.some(p=>p.part_number===value);
  // something is typed that is not in the catalog -> stay in manual mode
  const typed=!!value&&!known;
  const showText=manual||typed;

  const sel={width:'100%',padding:'5px 9px',fontSize:12,fontWeight:500,
    border:`1.5px solid ${value?tp.border:'#e2e8f0'}`,borderRadius:9,
    background:value?tp.light:'#ffffff',color:value?'#0f172a':'#94a3b8',
    outline:'none',cursor:'pointer'};

  if(showText){
    return(
      <div style={{flex:1,display:'flex',gap:5}}>
        <input type="text" value={value||''} autoFocus={manual}
          onChange={e=>onPick(e.target.value,null)}
          placeholder="Type a job or part"
          style={{flex:1,padding:'5px 8px',fontSize:12,border:'1.5px solid #334155',
            borderRadius:9,background:'#f8fafc',color:'#0f172a',outline:'none'}}/>
        <button onClick={()=>{setManual(false);onPick('',null);}} title="Pick from the list instead"
          style={{padding:'0 8px',borderRadius:9,border:'1.5px solid #e2e8f0',
            background:'#fff',color:'#64748b',fontSize:11,fontWeight:700,
            cursor:'pointer',whiteSpace:'nowrap'}}>List</button>
      </div>
    );
  }
  return(
    <select value={value||''} style={{...sel,flex:1}}
      onChange={e=>{
        const v=e.target.value;
        if(v==='__type__'){ setManual(true); onPick('',null); return; }
        onPick(v, list.find(p=>p.part_number===v)||null);
      }}>
      <option value="">{t.none}</option>
      {list.map(p=>(
        <option key={p.part_number} value={p.part_number}>
          {p.part_number}
          {p.description&&p.description!=='From machine program'
            ? '  -  '+(p.description.length>40?p.description.slice(0,40)+'...':p.description)
            : ''}
        </option>
      ))}
      <option value="__type__">+ Type something else...</option>
    </select>
  );
}

function ExcelImportModal({onImport,onClose,t}){
  const[rows,setRows]=useState([]);
  const[mapping,setMapping]=useState({});
  const[fileName,setFileName]=useState('');
  const[step,setStep]=useState('upload');
  const[importing,setImporting]=useState(false);
  const fileRef=useRef();

  const FIELDS=[
    {key:'job_number',label:'Job #',required:true,keywords:['job','job#','jobno','job number','job_number','work order','wo#','wo number']},
    {key:'part_name',label:'Part Name',required:false,keywords:['part','part name','description','part_name','item','component','part desc']},
    {key:'quantity',label:'Qty Target',required:false,keywords:['qty','quantity','target','pcs','pieces','count','amount','total']},
    {key:'machine_id',label:'Machine',required:false,keywords:['machine','machine id','machineid','machine_id','equip','equipment','center']},
    {key:'priority',label:'Priority',required:false,keywords:['priority','pri','urgency','importance']},
    {key:'planned_date',label:'Planned Date',required:false,keywords:['date','planned date','due date','schedule date','planned_date','due']},
    {key:'planned_shift',label:'Planned Shift',required:false,keywords:['shift','planned shift','turn','turno']},
    {key:'notes',label:'Notes',required:false,keywords:['notes','note','comment','comments','remarks','instructions','special']},
  ];

  const autoDetect=(headers)=>{
    const m={};
    FIELDS.forEach(f=>{
      const match=headers.find(h=>f.keywords.some(kw=>h.toLowerCase().trim().includes(kw)));
      if(match)m[f.key]=match;
    });
    return m;
  };

  const handleFile=async(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    setFileName(file.name);
    const ab=await file.arrayBuffer();
    await window.__loadXLSX();
    const wb=XLSX.read(ab,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const data=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'yyyy-mm-dd'});
    if(!data.length)return;
    const headers=data[0].map(h=>String(h||'').trim()).filter(Boolean);
    const dataRows=data.slice(1).filter(r=>r.some(c=>c!==null&&c!==undefined&&String(c).trim()!==''));
    setRows({headers,data:dataRows});
    setMapping(autoDetect(headers));
    setStep('map');
  };

  const doImport=async()=>{
    setImporting(true);
    const priorityNorm=v=>{if(!v)return 'medium';const l=String(v).toLowerCase();if(l.includes('high')||l.includes('alta')||l==='h'||l==='1')return 'high';if(l.includes('low')||l.includes('baja')||l==='l'||l==='3')return 'low';return 'medium';};
    const jobs=rows.data.map(row=>{
      const get=key=>{const col=mapping[key];if(!col)return '';const idx=rows.headers.indexOf(col);return idx>=0?String(row[idx]||'').trim():'';};
      const jn=get('job_number');
      if(!jn)return null;

// ─── ETA prediction helpers ──────────────────────────────────────────────────
const SHIFTS_PER_DAY=3;
function getMachineHistoryRate(machineId,schedData){
  // Average partsActual across all loaded shifts for this machine (only shifts that ran production)
  const samples=[];
  Object.values(schedData||{}).forEach(dateData=>{
    Object.values(dateData||{}).forEach(shiftData=>{
      const st=shiftData.stations&&shiftData.stations[machineId];
      if(st&&st.partsActual>0)samples.push(st.partsActual);
    });
  });
  return samples.length>0?Math.round(samples.reduce((a,b)=>a+b,0)/samples.length):null;
}
function calcJobETA(job,historyRate){
  const rate=job.rate_per_shift||historyRate||null;
  if(!rate||!job.quantity)return null;
  const remaining=Math.max(0,(job.quantity||0)-(job.parts_done||0));
  if(remaining===0)return{done:true,rate,remaining:0,shiftsLeft:0,daysLeft:0,etaDate:new Date()};
  const shiftsLeft=remaining/rate;
  const daysLeft=Math.ceil(shiftsLeft/SHIFTS_PER_DAY);
  const etaDate=new Date();
  etaDate.setDate(etaDate.getDate()+daysLeft);
  const isAuto=!job.rate_per_shift;
  return{done:false,rate,remaining,shiftsLeft:Math.ceil(shiftsLeft),daysLeft,etaDate,isAuto};
}
function fmtETA(eta,lang){
  if(!eta)return null;
  if(eta.done)return'✅ Done';
  const dateStr=eta.etaDate.toLocaleDateString(lang==='es'?'es-MX':'en-US',{month:'short',day:'numeric'});
  return`~${dateStr} (${eta.shiftsLeft}s / ${eta.daysLeft}d)`;
}

// ─── Sequential shift math ───────────────────────────────────────────────────
// Given a start (dateStr, shift 1-3), advance by n full shifts → {date, shift}
function addShifts(dateStr, startShift, n){
  if(n<=0)return{date:dateStr,shift:startShift};
  // shifts left on the start day (shift startShift through shift 3)
  const todayLeft=3-startShift+1;
  if(n<=todayLeft)return{date:dateStr,shift:startShift+n-1};
  let rem=n-todayLeft;
  const d=new Date(dateStr+'T12:00:00');
  d.setDate(d.getDate()+1);
  const fullDays=Math.floor(rem/3);
  rem=rem%3;
  d.setDate(d.getDate()+fullDays);
  if(rem===0){d.setDate(d.getDate()-1);return{date:d.toISOString().slice(0,10),shift:3};}
  return{date:d.toISOString().slice(0,10),shift:rem};
}
// Advance one shift beyond {date,shift} (the "next" start)
function nextSlot(dateStr,shift){
  if(shift<3)return{date:dateStr,shift:shift+1};
  const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+1);
  return{date:d.toISOString().slice(0,10),shift:1};
}
// Build sequential queue for one machine: jobs chained one after another
function buildMachineQueue(machineId,jobQueue,schedData){
  const today=todayStr();
  const jobs=jobQueue
    .filter(j=>j.machine_id===machineId&&j.kanban_status!=='complete'&&j.quantity>0)
    .sort((a,b)=>{
      if(a.kanban_status==='running'&&b.kanban_status!=='running')return -1;
      if(b.kanban_status==='running'&&a.kanban_status!=='running')return 1;
      if(a.planned_date&&b.planned_date){
        if(a.planned_date!==b.planned_date)return a.planned_date <b.planned_date?-1:1;
        return(a.planned_shift||1)-(b.planned_shift||1);
      }
      return a.planned_date?-1:b.planned_date?1:0;
    });
  const histRate=getMachineHistoryRate(machineId,schedData);
  let cursor={date:today,shift:1};
  return jobs.map(job=>{
    const rate=job.rate_per_shift||histRate||null;
    const remaining=Math.max(0,(job.quantity||0)-(job.parts_done||0));
    const shiftsNeeded=rate&&remaining>0?Math.ceil(remaining/rate):null;
    const startDate=cursor.date;
    const startShift=cursor.shift;
    let endDate=null,endShift=null;
    if(shiftsNeeded!==null&&shiftsNeeded>0){
      const end=addShifts(cursor.date,cursor.shift,shiftsNeeded);
      endDate=end.date;endShift=end.shift;
      const nxt=nextSlot(endDate,endShift);
      cursor={date:nxt.date,shift:nxt.shift};
    }
    return{...job,rate,remaining,shiftsNeeded,startDate,startShift,endDate,endShift,histRate};
  });
}

function ScrapModal({onClose,onSave,haasLive,machines}){
  var REASONS=['Dimensional','Surface Finish','Material Defect','Operator Error','Machine Fault','Tool Problem','Setup Error','Other'];
  function getCurShift(){
    var h=new Date().getHours();
    if(h>=6&&h<14)return'1st Shift';
    if(h>=14&&h<22)return'2nd Shift';
    return'3rd Shift';
  }
  var today=new Date().toISOString().slice(0,10);
  var[machine,setMachine]=useState(machines[0]);
  var[qty,setQty]=useState(1);
  var[reason,setReason]=useState(REASONS[0]);
  var[partNum,setPartNum]=useState('');
  var[workOrder,setWorkOrder]=useState('');
  var[notes,setNotes]=useState('');
  var[shift,setShift]=useState(getCurShift());
  var[saving,setSaving]=useState(false);
  var[error,setError]=useState('');

  // Auto-fill part number from live machine data
  function fillFromLive(){
    var lv=(haasLive||{})[machine]||{};
    if(lv.program)setPartNum(lv.program);
  }

  function handleSave(){
    if(!qty||qty<1){setError('Quantity must be at least 1');return;}
    setSaving(true);setError('');
    var row={
      machine_id:machine,
      shift_date:today,
      shift_name:shift,
      parts_made:parseInt(qty),
      good_parts:0,
      scrap_parts:parseInt(qty),
      part_number:partNum||null,
      work_order:workOrder||null,
      notes:notes||null,
      scrap_reason:reason,
      entry_type:'manual_scrap',
      record_time:new Date().toISOString()
    };
    sb.from('haas_production_log').insert([row])
      .then(function(res){
        if(res.error){setError(res.error.message);setSaving(false);}

      <div style={boxStyle}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:22}}>
          <div style={{width:42,height:42,borderRadius:12,background:'linear-gradient(135deg,#dc2626,#ef4444)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>🗑️</div>
          <div>
            <div style={{fontSize:17,fontWeight:900,color:'#0f172a'}}>Log Scrap Parts</div>
            <div style={{fontSize:11,color:'#94a3b8',marginTop:1}}>Record rejected or scrapped parts</div>
          </div>
          <button onClick={onClose} style={{marginLeft:'auto',background:'none',border:'none',fontSize:20,cursor:'pointer',color:'#94a3b8',padding:'4px 8px'}}>×</button>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
          <div>
            <label style={labelS}>Machine</label>
            <select value={machine} onChange={function(e){setMachine(e.target.value);}} style={inputS}>
              {machines.map(function(m){return <option key={m} value={m}>{m}</option>;})}
            </select>
          </div>
          <div>
            <label style={labelS}>Shift</label>
            <select value={shift} onChange={function(e){setShift(e.target.value);}} style={inputS}>
              <option>1st Shift</option>
              <option>2nd Shift</option>
              <option>3rd Shift</option>
            </select>
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
          <div>
            <label style={labelS}>Part Number / Program</label>
            <div style={{position:'relative'}}>
              <input value={partNum} onChange={function(e){setPartNum(e.target.value);}} placeholder="e.g. O1234" style={inputS}/>
              {(haasLive||{})[machine]&&(haasLive||{})[machine].program&&(
                <button onClick={fillFromLive} title="Auto-fill from machine"
                  style={{position:'absolute',right:6,top:'50%',transform:'translateY(-50%)',background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:6,fontSize:10,fontWeight:800,color:'#2563eb',cursor:'pointer',padding:'2px 6px'}}>
                  AUTO
                </button>
              )}
            </div>
          </div>
          <div>
            <label style={labelS}>Work Order (optional)</label>
            <input value={workOrder} onChange={function(e){setWorkOrder(e.target.value);}} placeholder="WO-001" style={inputS}/>
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'120px 1fr',gap:14,marginBottom:14}}>
          <div>
            <label style={labelS}>Qty Scrapped</label>
            <input type="number" min="1" value={qty} onChange={function(e){setQty(e.target.value);}}
              style={{...inputS,fontSize:20,fontWeight:900,textAlign:'center',color:'#dc2626',background:'#fef2f2',border:'2px solid #fca5a5'}}/>
          </div>
          <div>
            <label style={labelS}>Scrap Reason</label>
            <select value={reason} onChange={function(e){setReason(e.target.value);}} style={inputS}>
              {REASONS.map(function(r){return <option key={r} value={r}>{r}</option>;})}
            </select>
          </div>
        </div>

        <div style={rowS}>
          <label style={labelS}>Notes (optional)</label>
          <input value={notes} onChange={function(e){setNotes(e.target.value);}} placeholder="Additional details..." style={inputS}/>
        </div>

        {error&&<div style={{background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:8,padding:'8px 12px',color:'#dc2626',fontSize:12,fontWeight:700,marginBottom:12}}>{error}</div>}

        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:6}}>
          <button onClick={onClose} style={{padding:'9px 22px',borderRadius:9,border:'1.5px solid #e2e8f0',background:'#fff',color:'#64748b',fontWeight:700,fontSize:13,cursor:'pointer'}}>Cancel</button>
          <button onClick={handleSave} disabled={saving}
            style={{padding:'9px 28px',borderRadius:9,border:'none',background:saving?'#94a3b8':'linear-gradient(135deg,#dc2626,#b91c1c)',color:'#fff',fontWeight:800,fontSize:13,cursor:saving?'not-allowed':'pointer',boxShadow:'0 4px 14px rgba(220,38,38,.35)'}}>
            {saving?'Saving...':'🗑️ Log Scrap'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   PRODUCTION VIEW  -  Daily Production Tracking Dashboard
   ============================================================ */
function ProductionView({lang,haasLive,shiftHistory,jobQueue,schedData}){
  var en=lang==='en';
  var[subTab,setSubTab]=useState('summary');
  var[prodLog,setProdLog]=useState([]);
  var[downtimeLog,setDowntimeLog]=useState([]);
  var[reportRange,setReportRange]=useState('today');
  var[loading,setLoading]=useState(true);
  var[showScrapModal,setShowScrapModal]=useState(false);
  var today=new Date().toISOString().slice(0,10);

  // Current shift helper
  function getCurShift(){
    var h=new Date().getHours();
    if(h>=6&&h<14)return{name:'1st Shift',num:1};
    if(h>=14&&h<22)return{name:'2nd Shift',num:2};
    return{name:'3rd Shift',num:3};
  }
  var curShift=getCurShift();

  // Fetch production log
  function fetchProd(){
    var fromDate=today;
    if(reportRange==='week'){var d=new Date();d.setDate(d.getDate()-7);fromDate=d.toISOString().slice(0,10);}
    if(reportRange==='month'){var d=new Date();d.setDate(d.getDate()-30);fromDate=d.toISOString().slice(0,10);}
    setLoading(true);
    sb.from('haas_production_log').select('*').gte('shift_date',fromDate).order('record_time',{ascending:false}).limit(800)
      .then(function(res){setProdLog(res.data||[]);setLoading(false);})
      .catch(function(e){setLoading(false);});
  }

  function fetchDowntime(){
    var fromDate=today;
    if(reportRange==='week'){var d=new Date();d.setDate(d.getDate()-7);fromDate=d.toISOString().slice(0,10);}
    if(reportRange==='month'){var d=new Date();d.setDate(d.getDate()-30);fromDate=d.toISOString().slice(0,10);}
    sb.from('haas_downtime_log').select('*').gte('shift_date',fromDate).order('start_time',{ascending:false}).limit(500)
      .then(function(res){setDowntimeLog(res.data||[]);})
      .catch(function(e){});
  }

  useEffect(function(){fetchProd();fetchDowntime();},[reportRange]);
  useEffect(function(){var iv=setInterval(function(){fetchProd();fetchDowntime();},30000);return function(){clearInterval(iv);};},[reportRange]);

  // --- Computed summaries ---
  var todayProd=prodLog.filter(function(r){return r.shift_date===today;});
  var machines=['M453','M432','M439','M440'];

  // Total parts by machine today
  var byMachine={};
  machines.forEach(function(m){
    var rows=todayProd.filter(function(r){return r.machine_id===m;});
    var good=rows.reduce(function(s,r){return s+(r.good_parts||1);},0);
    var scrap=rows.reduce(function(s,r){return s+(r.scrap_parts||0);},0);
    var cycles=rows.filter(function(r){return r.actual_cycle_sec;}).map(function(r){return r.actual_cycle_sec;});
    var avgCyc=cycles.length?Math.round(cycles.reduce(function(s,c){return s+c;},0)/cycles.length):0;
    // Get target from job queue
    var curJob=jobQueue.find(function(j){return j.machine_id===m&&j.kanban_status==='running';});
    var target=curJob?Math.round((curJob.quantity||0)-(curJob.parts_done||0)):0;
    byMachine[m]={total:good+scrap,good,scrap,avgCyc,target,program:rows[0]?rows[0].program_name:null,curJob};
  });

  // By shift today
  var byShift={};
  todayProd.forEach(function(r){
    var sn=r.shift_name||'Unknown';
    if(!byShift[sn])byShift[sn]={total:0,good:0,scrap:0};
    byShift[sn].total+=(r.parts_made||1);
    byShift[sn].good+=(r.good_parts||1);
    byShift[sn].scrap+=(r.scrap_parts||0);
  });

  // By part number today
  var byPart={};
  todayProd.forEach(function(r){
    var p=r.part_number||r.program_name||'Unknown';
    if(!byPart[p])byPart[p]={total:0,good:0,scrap:0};
    byPart[p].total+=(r.parts_made||1);
    byPart[p].good+=(r.good_parts||1);
    byPart[p].scrap+=(r.scrap_parts||0);
  });

  // Grand totals today
  var totalGood=todayProd.reduce(function(s,r){return s+(r.good_parts||1);},0);
  var totalScrap=todayProd.reduce(function(s,r){return s+(r.scrap_parts||0);},0);
  var totalParts=totalGood+totalScrap;
  var scrapPct=totalParts>0?Math.round(totalScrap/totalParts*1000)/10:0;

  // Downtime today
  var todayDown=downtimeLog.filter(function(r){return r.shift_date===today;});
  var totalDownSec=todayDown.reduce(function(s,r){return s+(r.duration_seconds||0);},0);
  var downByMachine={};
  todayDown.forEach(function(r){
    if(!downByMachine[r.machine_id])downByMachine[r.machine_id]=0;
    downByMachine[r.machine_id]+=(r.duration_seconds||0);
  });
  var downByReason={};
  todayDown.forEach(function(r){
    var rs=r.reason||'Unknown';
    if(!downByReason[rs])downByReason[rs]=0;
    downByReason[rs]+=(r.duration_seconds||0);
  });

  // Export CSV
  function exportCSV(){
    var rows=[['Date','Shift','Machine','Part Number','Work Order','Parts Made','Good Parts','Scrap','Scrap Reason','Entry Type','Cycle Time(s)','Program','Time']];
    prodLog.forEach(function(r){
      rows.push([r.shift_date,r.shift_name,r.machine_id,r.part_number||'',r.work_order||'',r.parts_made||1,r.good_parts||1,r.scrap_parts||0,r.scrap_reason||'',r.actual_cycle_sec||'',r.program_name||'',r.record_time?r.record_time.slice(0,19):'']);
    });
    var csv=rows.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
    var blob=new Blob([csv],{type:'text/csv'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='production_'+today+'.csv';a.click();
    URL.revokeObjectURL(url);
  }

  var subTabs=[
    {key:'summary',label:'Summary',icon:'📊'},
    {key:'machines',label:'Machines',icon:'⚙️'},
    {key:'downtime',label:'Downtime',icon:'⚠️'},
    {key:'quality',label:'Quality',icon:'✅'},
    {key:'reports',label:'Reports',icon:'📋'},
  ];

  var cardStyle={background:'#ffffff',border:'1px solid #e2e8f0',borderRadius:14,padding:'16px 18px',boxShadow:'0 1px 4px rgba(0,0,0,.05)'};
  var numStyle={fontSize:28,fontWeight:900,lineHeight:1,marginBottom:3};
  var lblStyle={fontSize:10,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:.5};
  var thS={padding:'9px 12px',textAlign:'left',fontWeight:800,color:'#475569',fontSize:10,textTransform:'uppercase',letterSpacing:.5,borderBottom:'2px solid #e2e8f0',background:'#f8fafc',whiteSpace:'nowrap'};
  var tdS={padding:'8px 12px',borderBottom:'1px solid #f1f5f9',fontSize:12};

  function fmtSec(s){var h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?h+'h '+m+'m':m+'m';}

  return(
    <div style={{maxWidth:1600,margin:'0 auto',padding:'18px 22px 40px'}}>

      {/* Header */}
      <div style={{background:'linear-gradient(135deg,#0f172a,#1e3a5f)',borderRadius:16,padding:'18px 24px',marginBottom:18,display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <div style={{width:48,height:48,borderRadius:14,background:'linear-gradient(135deg,#16a34a,#22c55e)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>🏭</div>
          <div>
            <div style={{fontSize:18,fontWeight:900,color:'#fff'}}>Daily Production Tracking</div>
            <div style={{fontSize:11,color:'#94a3b8',marginTop:2}}>{today} · {curShift.name} · Auto-recorded from machines</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <select value={reportRange} onChange={function(e){setReportRange(e.target.value);}}
            style={{padding:'7px 12px',borderRadius:9,border:'1px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.1)',color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer',outline:'none'}}>
            <option value="today" style={{color:'#0f172a'}}>Today</option>
            <option value="week" style={{color:'#0f172a'}}>Last 7 Days</option>
            <option value="month" style={{color:'#0f172a'}}>Last 30 Days</option>
          </select>
          <button onClick={function(){fetchProd();fetchDowntime();}}
            style={{padding:'7px 16px',background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.25)',borderRadius:9,color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer'}}>🔄 Refresh</button>
          <button onClick={function(){setShowScrapModal(true);}}
            style={{padding:'7px 16px',background:'#dc2626',border:'none',borderRadius:9,color:'#fff',fontSize:12,fontWeight:800,cursor:'pointer',boxShadow:'0 3px 10px rgba(220,38,38,.35)'}}>🗑️ Log Scrap</button>
          <button onClick={exportCSV}
            style={{padding:'7px 16px',background:'#16a34a',border:'none',borderRadius:9,color:'#fff',fontSize:12,fontWeight:800,cursor:'pointer',boxShadow:'0 3px 10px rgba(22,163,74,.4)'}}>📥 Export CSV</button>
        </div>
      </div>

      {/* KPI Strip */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:10,marginBottom:18}}>
        {[
          {icon:'🔢',val:totalParts,lbl:'Total Parts',col:'#2563eb'},
          {icon:'✅',val:totalGood,lbl:'Good Parts',col:'#16a34a'},
          {icon:'❌',val:totalScrap,lbl:'Scrap Parts',col:totalScrap>0?'#dc2626':'#94a3b8'},
          {icon:'📉',val:scrapPct+'%',lbl:'Scrap Rate',col:scrapPct>3?'#dc2626':scrapPct>1?'#d97706':'#16a34a'},
          {icon:'⏱️',val:fmtSec(totalDownSec),lbl:'Total Downtime',col:totalDownSec>3600?'#dc2626':totalDownSec>1800?'#d97706':'#16a34a'},
          {icon:'🔴',val:todayDown.length,lbl:'Downtime Events',col:todayDown.length>5?'#dc2626':'#64748b'},
        ].map(function(k){
          return(
            <div key={k.lbl} style={{...cardStyle,textAlign:'center'}}>
              <div style={{fontSize:20,marginBottom:6}}>{k.icon}</div>
              <div style={{...numStyle,color:k.col}}>{k.val}</div>
              <div style={lblStyle}>{k.lbl}</div>
            </div>
          );
        })}
      </div>

      {/* Sub-tab nav */}
      <div style={{display:'flex',gap:4,marginBottom:16,background:'#fff',padding:'5px',borderRadius:12,border:'1px solid #e2e8f0',width:'fit-content'}}>
        {subTabs.map(function(st){
          var act=subTab===st.key;
          return(
            <button key={st.key} onClick={function(){setSubTab(st.key);}}
              style={{padding:'8px 18px',borderRadius:9,border:'none',background:act?'linear-gradient(135deg,#2563eb,#7c3aed)':'transparent',color:act?'#fff':'#64748b',fontSize:12,fontWeight:act?800:600,cursor:'pointer',whiteSpace:'nowrap'}}>
              {st.icon+' '+st.label}
            </button>
          );
        })}
      </div>

      {loading&&<div style={{textAlign:'center',padding:'60px',color:'#94a3b8',fontSize:14}}>Loading production data...</div>}

      {/* ── SUMMARY TAB ── */}
      {!loading&&subTab==='summary'&&(
        <div style={{display:'grid',gap:16}}>
          {/* By Machine */}
          <div style={cardStyle}>
            <div style={{fontSize:14,fontWeight:800,color:'#0f172a',marginBottom:14}}>Production by Machine — Today</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
              {machines.map(function(mid){
                var d=byMachine[mid]||{total:0,good:0,scrap:0,avgCyc:0,target:0};
                var lv=(haasLive||{})[mid]||{};
                var isRun=lv.status==='running';var isAlarm=lv.status==='alarm';
                var bc=isRun?'#22c55e':isAlarm?'#ef4444':'#eab308';
                var pct=d.target>0?Math.min(100,Math.round(d.good/d.target*100)):0;
                var oeeC=(lv.oee||0)>=85?'#16a34a':(lv.oee||0)>=65?'#d97706':'#dc2626';
                return(
                  <div key={mid} style={{border:'1.5px solid '+bc+'44',borderRadius:12,padding:'14px',background:isRun?'#f0fdf4':isAlarm?'#fef2f2':'#fafafa',position:'relative',overflow:'hidden'}}>
                    <div style={{position:'absolute',top:0,left:0,right:0,height:3,background:bc}}/>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                      <span style={{fontSize:15,fontWeight:900,color:'#0f172a'}}>{mid}</span>
                      <span style={{fontSize:9,fontWeight:800,color:bc,background:bc+'22',padding:'2px 7px',borderRadius:5,textTransform:'uppercase'}}>{lv.status||'offline'}</span>
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:8}}>
                      <div style={{textAlign:'center',background:'#eff6ff',borderRadius:8,padding:'8px 4px'}}>
                        <div style={{fontSize:22,fontWeight:900,color:'#2563eb'}}>{d.good}</div>
                        <div style={{fontSize:8,fontWeight:700,color:'#93c5fd',textTransform:'uppercase'}}>Good Parts</div>
                      </div>
                      <div style={{textAlign:'center',background:'#faf5ff',borderRadius:8,padding:'8px 4px'}}>
                        <div style={{fontSize:22,fontWeight:900,color:'#7c3aed'}}>{lv.parts_today||0}</div>
                        <div style={{fontSize:8,fontWeight:700,color:'#a78bfa',textTransform:'uppercase'}}>Total Today</div>
                      </div>
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:4,marginBottom:8}}>
                      <div style={{textAlign:'center',background:'#fff',borderRadius:6,padding:'5px 2px',border:'1px solid #e2e8f0'}}>
                        <div style={{fontSize:13,fontWeight:800,color:oeeC}}>{lv.oee||0}%</div>
                        <div style={{fontSize:7,color:'#94a3b8',textTransform:'uppercase'}}>OEE</div>
                      </div>
                      <div style={{textAlign:'center',background:'#fff',borderRadius:6,padding:'5px 2px',border:'1px solid #e2e8f0'}}>
                        <div style={{fontSize:13,fontWeight:800,color:'#475569'}}>{d.avgCyc>0?d.avgCyc+'s':'--'}</div>
                        <div style={{fontSize:7,color:'#94a3b8',textTransform:'uppercase'}}>Avg Cycle</div>
                      </div>
                      <div style={{textAlign:'center',background:'#fff',borderRadius:6,padding:'5px 2px',border:'1px solid #e2e8f0'}}>
                        <div style={{fontSize:13,fontWeight:800,color:d.scrap>0?'#dc2626':'#16a34a'}}>{d.scrap||0}</div>
                        <div style={{fontSize:7,color:'#94a3b8',textTransform:'uppercase'}}>Scrap</div>
                      </div>
                    </div>
                    {d.target>0&&(
                      <div>
                        <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'#64748b',marginBottom:3}}>
                          <span>Target Progress</span><span style={{fontWeight:700,color:pct>=100?'#16a34a':'#2563eb'}}>{d.good+'/'+d.target+' ('+pct+'%)'}</span>
                        </div>
                        <div style={{height:5,background:'#e2e8f0',borderRadius:10,overflow:'hidden'}}>
                          <div style={{height:'100%',width:pct+'%',background:pct>=100?'#22c55e':'linear-gradient(90deg,#2563eb,#7c3aed)',borderRadius:10,transition:'width .4s'}}/>
                        </div>
                      </div>
                    )}
                    {d.program&&<div style={{marginTop:6,fontSize:8,color:'#64748b',fontFamily:'monospace',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{'> '+d.program}</div>}
                  </div>
                );
              })}
            </div>
          </div>

          {/* By Shift + By Part */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            <div style={cardStyle}>
              <div style={{fontSize:14,fontWeight:800,color:'#0f172a',marginBottom:12}}>Production by Shift</div>
              {Object.keys(byShift).length===0?<div style={{color:'#94a3b8',fontSize:12,padding:'20px 0',textAlign:'center'}}>No shift data yet today</div>:(
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  {Object.entries(byShift).map(function(e){
                    var sn=e[0],sd=e[1];
                    var sc={'1st Shift':'#d97706','2nd Shift':'#2563eb','3rd Shift':'#7c3aed'}[sn]||'#64748b';
                    return(
                      <div key={sn} style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'#f8fafc',borderRadius:9,padding:'10px 14px',border:'1px solid #e2e8f0'}}>
                        <div style={{display:'flex',alignItems:'center',gap:8}}>
                          <div style={{width:10,height:10,borderRadius:'50%',background:sc}}/>
                          <span style={{fontWeight:700,color:'#0f172a',fontSize:12}}>{sn}</span>
                        </div>
                        <div style={{display:'flex',gap:16,fontSize:12}}>
                          <span style={{fontWeight:800,color:'#2563eb'}}>{sd.total} total</span>
                          <span style={{color:'#16a34a',fontWeight:700}}>{sd.good} good</span>
                          <span style={{color:sd.scrap>0?'#dc2626':'#94a3b8',fontWeight:sd.scrap>0?700:400}}>{sd.scrap} scrap</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
            <div style={cardStyle}>
              <div style={{fontSize:14,fontWeight:800,color:'#0f172a',marginBottom:12}}>Production by Part Number</div>
              {Object.keys(byPart).length===0?<div style={{color:'#94a3b8',fontSize:12,padding:'20px 0',textAlign:'center'}}>No part data yet</div>:(
                <div style={{overflowY:'auto',maxHeight:220}}>
                  {Object.entries(byPart).sort(function(a,b){return b[1].total-a[1].total;}).map(function(e){
                    var pn=e[0],pd=e[1];
                    var sPct=pd.total>0?Math.round(pd.scrap/pd.total*100):0;
                    return(
                      <div key={pn} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid #f1f5f9'}}>
                        <span style={{fontWeight:700,color:'#0f172a',fontFamily:'monospace',fontSize:11,overflow:'hidden',textOverflow:'ellipsis',maxWidth:160,whiteSpace:'nowrap'}}>{pn}</span>
                        <div style={{display:'flex',gap:10,alignItems:'center'}}>
                          <span style={{fontWeight:800,color:'#2563eb',fontSize:13}}>{pd.total}</span>
                          <span style={{fontSize:10,color:'#16a34a',fontWeight:700}}>{pd.good} ok</span>
                          {pd.scrap>0&&<span style={{fontSize:10,color:'#dc2626',fontWeight:800}}>{pd.scrap} scrap ({sPct}%)</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

function DashboardView({lang,shiftHistory,haasLive}){
  const yest=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);};
  const[dashDate,setDashDate]=useState(yest());
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(false);

  const shiftDay=(dir)=>{const d=new Date(dashDate+'T12:00:00');d.setDate(d.getDate()+dir);setDashDate(d.toISOString().slice(0,10));};

  const load=async(date)=>{
    setLoading(true);setData(null);
    try{
      let rows=[];
      const{data:sd}=await sb.from('shift_schedules').select('*').eq('shift_date',date);
      if(sd&&sd.length>0){rows=sd;}
      else{const{data:hd}=await sb.from('job_history').select('*').eq('shift_date',date);if(hd)rows=hd;}
      const byShift={};
      rows.forEach(r=>{
        const defSt={};ALL.forEach(id=>defSt[id]=blankSt());
        byShift[r.shift_number]={workers:r.workers||[],stations:{...defSt,...r.stations},notes:r.notes||'',lead:r.lead||'',supervisor:r.supervisor||''};
      });
      setData(byShift);
    }catch(e){console.error(e);}
    setLoading(false);
  };
  useEffect(()=>{load(dashDate);},[dashDate]);

  const en=lang==='en';
  const SC_DSH=[
    {main:'#d97706',light:'#fffbeb',border:'#fde68a',grad:'linear-gradient(135deg,#b45309,#d97706)',name:en?'Shift 1':'Turno 1',time:'6:00 AM – 2:00 PM',icon:'🌅'},
    {main:'#2563eb',light:'#eff6ff',border:'#bfdbfe',grad:'linear-gradient(135deg,#1d4ed8,#2563eb)',name:en?'Shift 2':'Turno 2',time:'2:00 PM – 10:00 PM',icon:'☀️'},
    {main:'#7c3aed',light:'#f5f3ff',border:'#ddd6fe',grad:'linear-gradient(135deg,#6d28d9,#7c3aed)',name:en?'Shift 3':'Turno 3',time:'10:00 PM – 6:00 AM',icon:'🌙'},
  ];
  const TYPE_CFG={
    haas:{color:'#2563eb',light:'#eff6ff',border:'#bfdbfe',bg:'#dbeafe',c:'#1d4ed8',lbl:'HAAS',icon:'⚙️'},
    lathe:{color:'#16a34a',light:'#f0fdf4',border:'#bbf7d0',bg:'#dcfce7',c:'#15803d',lbl:'LATHE',icon:'🔩'},
    deburr:{color:'#ea580c',light:'#fff7ed',border:'#fed7aa',bg:'#ffedd5',c:'#c2410c',lbl:'DBR',icon:'🔧'},
    assy:{color:'#7c3aed',light:'#f5f3ff',border:'#ddd6fe',bg:'#ede9fe',c:'#6d28d9',lbl:'ASSY',icon:'🏭'},
    vibratory:{color:'#0891b2',light:'#ecfeff',border:'#a5f3fc',bg:'#ecfeff',c:'#0e7490',lbl:'VIB',icon:'〰️'},
  };
  const barC=p=>p>=100?'#22c55e':p>=70?'#f59e0b':'#3b82f6';

  const shiftSum=(sd)=>{
    if(!sd)return null;
    let running=0,idle=0,maint=0,actTotal=0,tgtTotal=0,opSet=new Set(),jobs=[];
    const byType={haas:{act:0,tgt:0},lathe:{act:0,tgt:0},deburr:{act:0,tgt:0},assy:{act:0,tgt:0},vibratory:{act:0,tgt:0}};
    ALL.forEach(id=>{
      const st=sd.stations[id];if(!st)return;
      const tp=typeOf(id);
      if(st.status==='running')running++;else if(st.status==='maint')maint++;else idle++;
      const a=st.partsActual||0,tg=st.partsTarget||0;
      actTotal+=a;tgtTotal+=tg;
      if(byType[tp]){byType[tp].act+=a;byType[tp].tgt+=tg;}
      const op1=st.worker1Id&&sd.workers.find(w=>w.id===st.worker1Id);
      const op2=st.worker2Id&&sd.workers.find(w=>w.id===st.worker2Id);
      if(op1&&op1.name&&op1.name.trim())opSet.add(op1.name.trim());
      if(op2&&op2.name&&op2.name.trim())opSet.add(op2.name.trim());
      if(st.job&&st.job.trim())jobs.push(st.job.trim());
    });
    const eff=tgtTotal>0?Math.min(100,Math.round(actTotal/tgtTotal*100)):0;
    return{running,idle,maint,actTotal,tgtTotal,eff,ops:[...opSet],jobs:[...new Set(jobs)],byType,lead:sd.lead,sup:sd.supervisor,notes:sd.notes,workerCount:sd.workers.length};
  };

  const summaries=data?[1,2,3].map(i=>shiftSum(data[i]||null)):[null,null,null];
  const hasAny=summaries.some(Boolean);

  let totalAct=0,totalTgt=0,totalRunning=0,totalMaint=0,totalIdle=0;
  const allOpsSet=new Set();
  summaries.forEach(sm=>{if(!sm)return;totalAct+=sm.actTotal;totalTgt+=sm.tgtTotal;totalRunning+=sm.running;totalMaint+=sm.maint;totalIdle+=sm.idle;sm.ops.forEach(o=>allOpsSet.add(o));});
  const overallEff=totalTgt>0?Math.min(100,Math.round(totalAct/totalTgt*100)):0;
  const effColor=overallEff>=90?'#22c55e':overallEff>=70?'#d97706':'#ef4444';

  // Per-machine rollup
  let topMach='',topPcs=0,topEff={id:'',pct:0};
  const machRows=ALL.map(id=>{
    let totalA=0,totalT=0,jobs=[],ops=new Set(),perShift=[];
    for(let si=1;si<=3;si++){
      const sd=data&&data[si];
      const st=sd&&sd.stations[id];
      const act=st?st.partsActual||0:0,tgt=st?st.partsTarget||0:0,stat=st?st.status||'idle':'idle';
      const op1=st&&st.worker1Id&&sd&&sd.workers.find(w=>w.id===st.worker1Id);
      const op2=st&&st.worker2Id&&sd&&sd.workers.find(w=>w.id===st.worker2Id);
      if(op1&&op1.name&&op1.name.trim())ops.add(op1.name.trim());
      if(op2&&op2.name&&op2.name.trim())ops.add(op2.name.trim());
      const job=st&&st.job&&st.job.trim();if(job)jobs.push(job);
      totalA+=act;totalT+=tgt;
      perShift.push({act,tgt,stat,job:job||''});
    }
    const pct=totalT>0?Math.min(100,Math.round(totalA/totalT*100)):0;
    if(totalA>topPcs){topPcs=totalA;topMach=id;}
    if(pct>topEff.pct&&totalT>0){topEff={id,pct};}
    return{id,type:typeOf(id),perShift,totalA,totalT,pct,jobs:[...new Set(jobs)],ops:[...ops]};
  });

  // Group by type
  const byTypeGroup={haas:machRows.filter(r=>r.type==='haas'),lathe:machRows.filter(r=>r.type==='lathe'),deburr:machRows.filter(r=>r.type==='deburr'),assy:machRows.filter(r=>r.type==='assy'),vibratory:machRows.filter(r=>r.type==='vibratory')};

  // Operator roster across all shifts
  const opMachines={};
  summaries.forEach((sm,si)=>{
    if(!sm||!data||!data[si+1])return;
    const sd=data[si+1];
    ALL.forEach(id=>{
      const st=sd.stations[id];if(!st)return;
      [st.worker1Id,st.worker2Id].forEach(wid=>{
        if(!wid)return;
        const w=sd.workers.find(x=>x.id===wid);
        if(!w||!w.name||!w.name.trim())return;
        const name=w.name.trim();
        if(!opMachines[name])opMachines[name]={machines:[],shifts:[]};
        if(!opMachines[name].machines.includes(id))opMachines[name].machines.push(id);
        if(!opMachines[name].shifts.includes(si+1))opMachines[name].shifts.push(si+1);
      });
    });
  });

  const fmtDateFull=d=>new Date(d+'T12:00:00').toLocaleDateString(lang==='es'?'es-MX':'en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  // Section divider style
  const divStyle={background:'#f8fafc',borderRadius:16,padding:'20px',marginBottom:20,border:'1.5px solid #e2e8f0',boxShadow:'0 2px 8px rgba(0,0,0,.04)'};

  return(
    <div style={{maxWidth:1600,margin:'0 auto',padding:'18px 22px 40px'}}>

      {/* ── DASHBOARD HERO HEADER ── */}
      <div style={{background:'linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#1e293b 100%)',borderRadius:18,padding:'22px 28px',marginBottom:20,display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:16,boxShadow:'0 8px 32px rgba(15,23,42,.18)'}}>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <div style={{width:52,height:52,borderRadius:16,background:'linear-gradient(135deg,#2563eb,#7c3aed)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,boxShadow:'0 4px 18px rgba(37,99,235,.45)'}}>📊</div>
          <div>
            <div style={{fontSize:20,fontWeight:900,color:'#fff',letterSpacing:'-0.02em'}}>{en?'Daily Production Dashboard':'Dashboard de Producción Diaria'}</div>
            <div style={{fontSize:12,color:'#94a3b8',marginTop:3}}>{hasAny?fmtDateFull(dashDate):(en?'NIDC · Secondary Machining Dept.':'NIDC · Depto. Maquinado Secundario')}</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <button onClick={()=>shiftDay(-1)} style={{padding:'8px 14px',background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.2)',borderRadius:10,cursor:'pointer',fontSize:13,color:'#fff',fontWeight:700}}>‹ {en?'Prev Day':'Día Ant.'}</button>
          <input type="date" value={dashDate} onChange={e=>setDashDate(e.target.value)}
            style={{border:'1.5px solid rgba(255,255,255,.25)',borderRadius:10,padding:'7px 13px',fontSize:12,color:'#fff',background:'rgba(255,255,255,.12)',outline:'none'}}/>
          <button onClick={()=>shiftDay(1)} style={{padding:'8px 14px',background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.2)',borderRadius:10,cursor:'pointer',fontSize:13,color:'#fff',fontWeight:700}}>{en?'Next Day':'Día Sig.'} ›</button>
          <button onClick={()=>load(dashDate)} style={{padding:'8px 16px',background:'#2563eb',border:'none',borderRadius:10,cursor:'pointer',fontSize:12,fontWeight:800,color:'#fff',boxShadow:'0 3px 10px rgba(37,99,235,.4)'}}>
            🔄 {en?'Refresh':'Actualizar'}
          </button>
        </div>
      </div>

      {/* ── CNC LIVE MACHINE PANEL ── */}
      {haasLive&&Object.keys(haasLive).length>0&&(
        <div style={{background:'#0f172a',borderRadius:16,padding:'16px 20px',marginBottom:16,border:'1px solid #1e293b'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
            <span style={{width:8,height:8,borderRadius:'50%',background:'#22c55e',display:'inline-block',boxShadow:'0 0 6px #22c55e'}}/>
            <span style={{fontSize:12,fontWeight:800,color:'#f1f5f9',textTransform:'uppercase',letterSpacing:.5}}>CNC Machines — Live Now</span>
            <span style={{fontSize:10,color:'#64748b',marginLeft:4}}>auto-refresh every 10s</span>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
            {['M453','M432','M439','M440'].map(function(mid){
              var lv=(haasLive||{})[mid];
              if(!lv)return <div key={mid} style={{background:'#1e293b',borderRadius:10,padding:'10px 12px',border:'1px solid #334155',opacity:.5}}><div style={{fontSize:12,fontWeight:800,color:'#64748b'}}>{mid}</div><div style={{fontSize:10,color:'#475569',marginTop:2}}>No data</div></div>;
              var isRun=lv.status==='running';var isAlarm=lv.status==='alarm';
              var bc=isRun?'#22c55e':isAlarm?'#ef4444':'#eab308';
              var oeeC=lv.oee>=85?'#22c55e':lv.oee>=65?'#f59e0b':'#ef4444';
              return(
                <div key={mid} style={{background:'#1e293b',borderRadius:10,padding:'10px 12px',border:'1.5px solid '+bc+'44',position:'relative',overflow:'hidden'}}>
                  <div style={{position:'absolute',top:0,left:0,width:3,height:'100%',background:bc,borderRadius:'10px 0 0 10px'}}/>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                    <span style={{fontSize:13,fontWeight:900,color:'#f1f5f9'}}>{mid}</span>
                    <span style={{fontSize:9,fontWeight:800,color:bc,background:bc+'22',padding:'1px 6px',borderRadius:4,textTransform:'uppercase'}}>{lv.status||'offline'}</span>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,marginBottom:6}}>
                    <div style={{textAlign:'center',background:'#0f172a',borderRadius:6,padding:'4px 2px'}}>
                      <div style={{fontSize:16,fontWeight:900,color:'#7c3aed',lineHeight:1}}>{lv.parts_this_shift||0}</div>
                      <div style={{fontSize:7,color:'#475569',textTransform:'uppercase',marginTop:1}}>Shift PCS</div>
                    </div>
                    <div style={{textAlign:'center',background:'#0f172a',borderRadius:6,padding:'4px 2px'}}>
                      <div style={{fontSize:16,fontWeight:900,color:'#3b82f6',lineHeight:1}}>{lv.parts_today||0}</div>
                      <div style={{fontSize:7,color:'#475569',textTransform:'uppercase',marginTop:1}}>Today</div>
                    </div>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:3}}>
                    <div style={{textAlign:'center',background:'#0f172a',borderRadius:5,padding:'3px 1px'}}>
                      <div style={{fontSize:12,fontWeight:900,color:oeeC}}>{lv.oee||0}%</div>
                      <div style={{fontSize:7,color:'#475569',textTransform:'uppercase'}}>OEE</div>
                    </div>
                    <div style={{textAlign:'center',background:'#0f172a',borderRadius:5,padding:'3px 1px'}}>
                      <div style={{fontSize:12,fontWeight:900,color:'#94a3b8'}}>{lv.avg_cycle_sec?Math.round(lv.avg_cycle_sec)+'s':'--'}</div>
                      <div style={{fontSize:7,color:'#475569',textTransform:'uppercase'}}>Cycle</div>
                    </div>
                    <div style={{textAlign:'center',background:'#0f172a',borderRadius:5,padding:'3px 1px'}}>
                      <div style={{fontSize:12,fontWeight:900,color:'#94a3b8'}}>{lv.avg_feed_pct||100}%</div>
                      <div style={{fontSize:7,color:'#475569',textTransform:'uppercase'}}>Feed</div>
                    </div>
                  </div>
                  {lv.program&&lv.program!=='-'&&<div style={{marginTop:5,fontSize:8,color:'#475569',fontFamily:'monospace',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{'> '+lv.program}</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── CNC SHIFT HISTORY ── */}
      {shiftHistory&&shiftHistory.length>0&&(function(){
        var today=new Date().toISOString().slice(0,10);
        var byDate={};
        shiftHistory.forEach(function(r){
          if(!byDate[r.shift_date])byDate[r.shift_date]={date:r.shift_date,machines:{}};
          if(!byDate[r.shift_date].machines[r.machine_id])byDate[r.shift_date].machines[r.machine_id]=[];
          byDate[r.shift_date].machines[r.machine_id].push(r);
        });
        var dates=Object.keys(byDate).sort().reverse().slice(0,7);
        var machines=['M453','M432','M439','M440'];
        var shiftColors={'1st Shift':'#d97706','2nd Shift':'#2563eb','3rd Shift':'#7c3aed'};
        return(
          <div style={{background:'#ffffff',border:'1px solid #e2e8f0',borderRadius:16,overflow:'hidden',marginBottom:16,boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
            <div style={{background:'linear-gradient(135deg,#0f172a,#1e3a5f)',padding:'14px 20px',display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:18}}>📋</span>
              <div>
                <div style={{fontSize:14,fontWeight:800,color:'#f1f5f9'}}>CNC Machine History — Last 7 Days</div>
                <div style={{fontSize:10,color:'#94a3b8',marginTop:1}}>Parts made, OEE and run time per shift · saved automatically</div>
              </div>
            </div>
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:11,minWidth:700}}>
                <thead>
                  <tr style={{background:'#f8fafc',borderBottom:'2px solid #e2e8f0'}}>
                    <th style={{padding:'9px 14px',textAlign:'left',fontWeight:800,color:'#475569',fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Date</th>
                    <th style={{padding:'9px 10px',textAlign:'left',fontWeight:800,color:'#475569',fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Shift</th>
                    {machines.map(function(m){return(
                      <th key={m} colSpan={3} style={{padding:'9px 10px',textAlign:'center',fontWeight:800,color:'#2563eb',fontSize:10,textTransform:'uppercase',letterSpacing:.5,borderLeft:'2px solid #e2e8f0'}}>{m}</th>
                    );})}
                  </tr>
                  <tr style={{background:'#f1f5f9',borderBottom:'1px solid #e2e8f0'}}>
                    <th style={{padding:'4px 14px'}}/>
                    <th style={{padding:'4px 10px'}}/>
                    {machines.map(function(m){return(
                      <React.Fragment key={m}>
                        <th style={{padding:'4px 6px',textAlign:'center',fontSize:9,fontWeight:700,color:'#94a3b8',borderLeft:'2px solid #e2e8f0'}}>PCS</th>
                        <th style={{padding:'4px 6px',textAlign:'center',fontSize:9,fontWeight:700,color:'#94a3b8'}}>OEE</th>
                        <th style={{padding:'4px 6px',textAlign:'center',fontSize:9,fontWeight:700,color:'#94a3b8'}}>RUN</th>
                      </React.Fragment>
                    );})}
                  </tr>
                </thead>
                <tbody>
                  {dates.map(function(date,di){
                    var dayData=byDate[date];
                    var allShifts=[];
                    machines.forEach(function(m){(dayData.machines[m]||[]).forEach(function(r){if(allShifts.indexOf(r.shift_name)===-1)allShifts.push(r.shift_name);});});
                    allShifts.sort();
                    if(allShifts.length===0)allShifts=['—'];
                    return allShifts.map(function(sn,si){
                      var isToday=date===today;
                      var sc=shiftColors[sn]||'#64748b';
                      return(
                        <tr key={date+sn} style={{borderBottom:'1px solid #f1f5f9',background:si===0&&di%2===0?'#fff':si===0&&di%2===1?'#fafafa':si%2===0?'#fffbf0':'#f5f3ff'}}>
                          {si===0&&<td rowSpan={allShifts.length} style={{padding:'7px 14px',fontWeight:700,color:isToday?'#2563eb':'#0f172a',verticalAlign:'middle',whiteSpace:'nowrap',borderRight:'1px solid #f1f5f9'}}>
                            {isToday&&<span style={{fontSize:9,fontWeight:800,color:'#fff',background:'#22c55e',padding:'1px 5px',borderRadius:4,marginRight:4}}>TODAY</span>}
                            {date}
                          </td>}
                          <td style={{padding:'7px 10px',whiteSpace:'nowrap'}}>
                            <span style={{fontSize:10,fontWeight:800,color:sc,background:sc+'15',padding:'2px 7px',borderRadius:5}}>{sn}</span>
                          </td>
                          {machines.map(function(mid){
                            var rec=(dayData.machines[mid]||[]).find(function(r){return r.shift_name===sn;});
                            var oeeC=rec&&rec.oee>=85?'#16a34a':rec&&rec.oee>=65?'#d97706':'#dc2626';
                            var runH=rec?Math.floor((rec.run_seconds||0)/3600):0;
                            var runM=rec?Math.floor(((rec.run_seconds||0)%3600)/60):0;
                            return(
                              <React.Fragment key={mid}>
                                <td style={{padding:'7px 8px',textAlign:'center',fontWeight:800,color:'#2563eb',fontSize:13,borderLeft:'2px solid #f1f5f9'}}>{rec?rec.parts_made:'-'}</td>
                                <td style={{padding:'7px 8px',textAlign:'center'}}>
                                  {rec?<span style={{fontWeight:800,color:oeeC,fontSize:12}}>{rec.oee+'%'}</span>:<span style={{color:'#e2e8f0'}}>-</span>}
                                </td>
                                <td style={{padding:'7px 8px',textAlign:'center',fontFamily:'monospace',color:'#64748b',fontSize:10}}>{rec?(runH+'h'+runM+'m'):'-'}</td>
                              </React.Fragment>
                            );
                          })}
                        </tr>
                      );
                    });
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })()}

      {loading&&(
        <div style={{textAlign:'center',padding:'70px 0',color:'#94a3b8'}}>
          <div style={{fontSize:38,marginBottom:12,animation:'spin 1s linear infinite'}}>⏳</div>
          <div style={{fontSize:14,fontWeight:600}}>{en?'Loading production data…':'Cargando datos de producción…'}</div>
        </div>
      )}

      {!loading&&!hasAny&&(
        <div style={{textAlign:'center',padding:'70px 0',border:'2px dashed #e2e8f0',borderRadius:18,background:'#fff',color:'#94a3b8'}}>
          <div style={{fontSize:46,marginBottom:12}}>📭</div>
          <div style={{fontSize:16,fontWeight:800,color:'#475569',marginBottom:6}}>{en?'No Data for This Date':'Sin Datos para Esta Fecha'}</div>
          <div style={{fontSize:12}}>{en?'Save at least one shift on the Schedule tab to see the dashboard.':'Guarda al menos un turno en el tab Horario para ver el dashboard.'}</div>
        </div>
      )}

      {/* ══════════════════════════════════════════
          LIVE FLOOR FEED (always visible at top)
      ══════════════════════════════════════════ */}
      <LiveFloorSection en={en}/>

      {!loading&&hasAny&&(<>

        {/* ══════════════════════════════════════════
            SECTION 1 — BIG KPI NUMBERS
        ══════════════════════════════════════════ */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12,marginBottom:20}}>
          {[
            {icon:'🏭',lbl:en?'Total Parts Made':'Total Piezas Hechas',val:totalAct.toLocaleString(),sub:`${en?'Target':'Meta'}: ${totalTgt.toLocaleString()} pcs`,top:'#2563eb',c:'#2563eb',grad:'linear-gradient(135deg,#dbeafe,#eff6ff)'},
            {icon:'🎯',lbl:en?'Overall Efficiency':'Eficiencia General',val:`${overallEff}%`,sub:`${totalAct} / ${totalTgt} pcs`,top:effColor,c:effColor,grad:overallEff>=90?'linear-gradient(135deg,#dcfce7,#f0fdf4)':overallEff>=70?'linear-gradient(135deg,#fef9c3,#fffbeb)':'linear-gradient(135deg,#fee2e2,#fef2f2)'},
            {icon:'👷',lbl:en?'Operators Active':'Operadores Activos',val:allOpsSet.size,sub:[...allOpsSet].slice(0,2).join(', ')+(allOpsSet.size>2?` +${allOpsSet.size-2}`:''),top:'#d97706',c:'#b45309',grad:'linear-gradient(135deg,#fef3c7,#fffbeb)'},
            {icon:'🏆',lbl:en?'Top Machine':'Mejor Máquina',val:topMach||'—',sub:topPcs>0?`${topPcs} pcs today`:'—',top:'#7c3aed',c:'#6d28d9',grad:'linear-gradient(135deg,#ede9fe,#f5f3ff)',big:true},
            {icon:'⚡',lbl:en?'Machines Running':'Máquinas Activas',val:totalRunning,sub:`${en?'Idle':'Inactivas'}: ${totalIdle} · ${en?'Maint':'Mant.'}: ${totalMaint}`,top:'#22c55e',c:'#15803d',grad:'linear-gradient(135deg,#dcfce7,#f0fdf4)'},
            {icon:'📋',lbl:en?'Shifts Completed':'Turnos Completados',val:`${summaries.filter(Boolean).length}/3`,sub:summaries.map((s,i)=>s?SC_DSH[i].name:'').filter(Boolean).join(' · '),top:'#0891b2',c:'#0e7490',grad:'linear-gradient(135deg,#cffafe,#ecfeff)'},
          ].map(({icon,lbl,val,sub,top,c,grad,big})=>(
            <div key={lbl} style={{background:grad||'#fff',border:`1.5px solid ${top}33`,borderRadius:14,padding:'18px 16px',textAlign:'center',position:'relative',overflow:'hidden',boxShadow:`0 2px 12px ${top}14`}}>
              <div style={{position:'absolute',top:0,left:0,right:0,height:4,background:top,borderRadius:'14px 14px 0 0'}}/>
              <div style={{fontSize:22,marginBottom:6,marginTop:2}}>{icon}</div>
              <div style={{fontSize:9,color:c,textTransform:'uppercase',letterSpacing:.8,fontWeight:800,marginBottom:5,opacity:.8}}>{lbl}</div>
              <div style={{fontSize:big?22:30,fontWeight:900,color:c,lineHeight:1}}>{val}</div>
              <div style={{fontSize:10,color:'#64748b',marginTop:5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{sub}</div>
            </div>
          ))}
        </div>

        {/* ══════════════════════════════════════════
            SECTION 2 — SHIFT COMPARISON (3 cards)
        ══════════════════════════════════════════ */}
        <div style={divStyle}>
          <SectionHeader icon="🔄" label={en?'Shift-by-Shift Comparison':'Comparación por Turno'} color="#2563eb" sub={en?'Performance breakdown for each of the 3 shifts':'Desglose de rendimiento para cada uno de los 3 turnos'}/>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14}}>
            {[0,1,2].map(i=>{
              const sm=summaries[i];const sc2=SC_DSH[i];
              return(
                <div key={i} style={{background:'#fff',border:`2px solid ${sm?sc2.border:'#e2e8f0'}`,borderRadius:14,overflow:'hidden',boxShadow:`0 3px 14px ${sc2.main}11`}}>
                  {/* Shift card header */}
                  <div style={{background:sc2.grad,padding:'14px 16px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      <div style={{width:36,height:36,borderRadius:10,background:'rgba(255,255,255,.25)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{sc2.icon}</div>
                      <div>
                        <div style={{fontSize:14,fontWeight:900,color:'#fff'}}>{sc2.name}</div>
                        <div style={{fontSize:10,color:'rgba(255,255,255,.8)',marginTop:1}}>{sc2.time}</div>
                      </div>
                    </div>
                    {sm&&<MiniDonut pct={sm.eff} color="#fff" size={50}/>}
                    {!sm&&<div style={{fontSize:11,color:'rgba(255,255,255,.6)',fontStyle:'italic'}}>{en?'No data':'Sin datos'}</div>}
                  </div>
                  {/* Big parts number */}
                  {sm&&(
                    <div style={{background:sc2.light,padding:'12px 16px',borderBottom:`1px solid ${sc2.border}`,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,textAlign:'center'}}>
                      {[
                        {l:en?'Made':'Hechas',v:`${sm.actTotal}`,c:sc2.main},
                        {l:en?'Target':'Meta',v:`${sm.tgtTotal}`,c:'#475569'},
                        {l:en?'Efficiency':'Eficiencia',v:`${sm.eff}%`,c:sm.eff>=90?'#16a34a':sm.eff>=70?'#d97706':'#dc2626'},
                      ].map(({l,v,c})=>(
                        <div key={l}>
                          <div style={{fontSize:18,fontWeight:900,color:c}}>{v}</div>
                          <div style={{fontSize:9,color:'#94a3b8',textTransform:'uppercase',letterSpacing:.5,fontWeight:700}}>{l}</div>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{padding:'12px 16px',display:'flex',flexDirection:'column',gap:6}}>
                    {!sm
                      ?<div style={{textAlign:'center',color:'#94a3b8',fontSize:12,padding:'16px 0',fontStyle:'italic'}}>{en?'No shift data was saved for this slot.':'No se guardaron datos para este turno.'}</div>
                      :<>
                        {/* Status row */}
                        <div style={{display:'flex',gap:6,marginBottom:4}}>
                          {[
                            {dot:'#22c55e',label:en?'Running':'Activas',val:sm.running},
                            {dot:'#94a3b8',label:en?'Idle':'Inactivas',val:sm.idle},
                            {dot:'#ef4444',label:en?'Maint.':'Mant.',val:sm.maint},
                          ].map(({dot,label,val})=>(
                            <div key={label} style={{flex:1,background:'#f8fafc',borderRadius:8,padding:'6px 4px',textAlign:'center',border:'1px solid #e2e8f0'}}>
                              <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:4}}>
                                <span style={{width:7,height:7,borderRadius:'50%',background:dot,display:'inline-block'}}/>
                                <span style={{fontSize:14,fontWeight:900,color:'#0f172a'}}>{val}</span>
                              </div>
                              <div style={{fontSize:9,color:'#94a3b8',textTransform:'uppercase',letterSpacing:.4,fontWeight:700}}>{label}</div>
                            </div>
                          ))}
                        </div>
                        {/* Efficiency bar */}
                        <div>
                          <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                            <span style={{fontSize:10,color:'#64748b',fontWeight:600}}>{en?'Production Progress':'Progreso de Producción'}</span>
                            <span style={{fontSize:10,fontWeight:800,color:barC(sm.eff)}}>{sm.eff}%</span>
                          </div>
                          <div style={{height:8,background:'#f1f5f9',borderRadius:6,overflow:'hidden'}}>
                            <div style={{height:'100%',width:`${sm.eff}%`,background:sm.eff>=90?'#22c55e':sm.eff>=70?'#f59e0b':'#3b82f6',borderRadius:6,transition:'width .5s'}}/>
                          </div>
                        </div>
                        {/* Per-type breakdown */}
                        <div style={{background:'#f8fafc',borderRadius:9,padding:'8px 10px',marginTop:2}}>
                          <div style={{fontSize:9,color:'#94a3b8',fontWeight:800,textTransform:'uppercase',letterSpacing:.5,marginBottom:6}}>{en?'By Department':'Por Departamento'}</div>
                          {Object.entries(sm.byType).filter(([,v])=>v.tgt>0||v.act>0).map(([tp,v])=>{
                            const tc=TYPE_CFG[tp];const ep=v.tgt>0?Math.min(100,Math.round(v.act/v.tgt*100)):0;
                            return(
                              <div key={tp} style={{display:'flex',alignItems:'center',gap:7,marginBottom:5}}>
                                <span style={{fontSize:9,background:tc.bg,color:tc.c,padding:'1px 5px',borderRadius:5,fontWeight:800,minWidth:28,textAlign:'center'}}>{tc.lbl}</span>
                                <div style={{flex:1,height:5,background:'#e2e8f0',borderRadius:3,overflow:'hidden'}}>
                                  <div style={{height:'100%',width:`${ep}%`,background:tc.color,borderRadius:3}}/>
                                </div>
                                <span style={{fontSize:10,fontWeight:700,color:tc.color,minWidth:28,textAlign:'right'}}>{v.act}p</span>
                              </div>
                            );
                          })}
                          {Object.values(sm.byType).every(v=>v.tgt===0&&v.act===0)&&<div style={{fontSize:10,color:'#cbd5e1',textAlign:'center'}}>—</div>}
                        </div>
                        {/* Leadership */}
                        {(sm.lead||sm.sup)&&(
                          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                            {sm.lead&&<div style={{background:'#f8fafc',borderRadius:8,padding:'6px 9px',border:'1px solid #e2e8f0'}}>
                              <div style={{fontSize:8,color:'#94a3b8',fontWeight:800,textTransform:'uppercase',letterSpacing:.4}}>{en?'Lead':'Líder'}</div>
