                    </div>
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>

        {/* ══════════════════════════════════════════
            SECTION 5 — OPERATOR ROSTER
        ══════════════════════════════════════════ */}
        {Object.keys(opMachines).length>0&&(
          <div style={divStyle}>
            <SectionHeader icon="👷" label={en?'Operator Roster — Who Worked What':'Roster de Operadores — Quién Trabajó Qué'} color="#d97706" sub={en?`${Object.keys(opMachines).length} operators active today`:`${Object.keys(opMachines).length} operadores activos hoy`}/>

                      <div style={{fontSize:13,fontWeight:800,color:'#0f172a'}}>{name}</div>
                      <div style={{fontSize:10,color:'#94a3b8'}}>{info.machines.length} {en?'machine':'máquina'}{info.machines.length!==1?'s':''}</div>
                    </div>
                  </div>
                  <div style={{fontSize:9,color:'#94a3b8',fontWeight:800,textTransform:'uppercase',letterSpacing:.5,marginBottom:5}}>{en?'Machines Operated':'Máquinas Operadas'}</div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6}}>
                    {info.machines.map(m=>{
                      const tp=typeOf(m);const tc=TYPE_CFG[tp];
                      return <span key={m} style={{background:tc.bg,color:tc.c,fontSize:10,fontWeight:800,padding:'2px 7px',borderRadius:7,border:`1px solid ${tc.border}`}}>{m}</span>;
                    })}
                  </div>
                  <div style={{fontSize:9,color:'#94a3b8',fontWeight:800,textTransform:'uppercase',letterSpacing:.5,marginBottom:4}}>{en?'Shifts':'Turnos'}</div>
                  <div style={{display:'flex',gap:4}}>
                    {info.shifts.map(s=><span key={s} style={{background:SC_DSH[s-1].light,color:SC_DSH[s-1].main,fontSize:10,fontWeight:800,padding:'2px 8px',borderRadius:6,border:`1px solid ${SC_DSH[s-1].border}`}}>S{s}</span>)}
                  </div>
                </div>
              ))}
            </div>

        {/* ══════════════════════════════════════════

        ══════════════════════════════════════════ */}
        {summaries.some(s=>s&&s.notes&&s.notes.trim())&&(
          <div style={divStyle}>
            <SectionHeader icon="📝" label={en?'Shift Notes & Comments':'Notas del Turno y Comentarios'} color="#f59e0b" sub={en?'Notes recorded by each shift lead':'Notas registradas por cada líder de turno'}/>

              {[0,1,2].map(i=>{
                const sm=summaries[i];const sc2=SC_DSH[i];
                return(
                  <div key={i} style={{background:'#fff',border:`2px solid ${sm&&sm.notes&&sm.notes.trim()?sc2.border:'#f1f5f9'}`,borderRadius:12,overflow:'hidden'}}>
                    <div style={{background:sm&&sm.notes&&sm.notes.trim()?sc2.light:'#f8fafc',padding:'10px 14px',borderBottom:`1.5px solid ${sc2.border}`,display:'flex',alignItems:'center',gap:8}}>

                        <div style={{fontSize:12,fontWeight:800,color:sc2.main}}>{sc2.name}</div>
                        <div style={{fontSize:10,color:sc2.main+'88'}}>{sc2.time}</div>

                    <div style={{padding:'12px 14px',fontSize:12,color:'#475569',lineHeight:1.7,minHeight:70,whiteSpace:'pre-wrap'}}>
                      {sm&&sm.notes&&sm.notes.trim()

          </div>

        {/* ══════════════════════════════════════════
            SECTION 7 — MAINTENANCE ALERTS
        ══════════════════════════════════════════ */}
        {machRows.some(r=>r.perShift.some(ps=>ps.stat==='maint'))&&(
          <div style={{...divStyle,borderColor:'#fecaca',background:'linear-gradient(135deg,#fff5f5,#fff)'}}>
            <SectionHeader icon="⚠️" label={en?'Maintenance Alerts':'Alertas de Mantenimiento'} color="#ef4444" sub={en?'Machines that were in maintenance during the day':'Máquinas en mantenimiento durante el día'}/>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:10}}>
              {machRows.filter(r=>r.perShift.some(ps=>ps.stat==='maint')).map(row=>{
                const tc=TYPE_CFG[row.type];
                const maintShifts=row.perShift.map((ps,i)=>ps.stat==='maint'?SC_DSH[i].name:null).filter(Boolean);
                return(
                  <div key={row.id} style={{background:'#fff',border:'1.5px solid #fecaca',borderRadius:12,padding:'12px 14px',boxShadow:'0 2px 8px rgba(239,68,68,.1)'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                      <div style={{width:32,height:32,borderRadius:9,background:'#fee2e2',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>⚠️</div>
                      <div>
                        <div style={{fontSize:14,fontWeight:900,color:'#dc2626'}}>{row.id}</div>
                        <span style={{background:tc.bg,color:tc.c,fontSize:9,fontWeight:800,padding:'1px 5px',borderRadius:5}}>{tc.lbl}</span>
                      </div>
                    </div>
                    <div style={{fontSize:9,color:'#94a3b8',fontWeight:800,textTransform:'uppercase',letterSpacing:.5,marginBottom:5}}>{en?'In Maintenance During':'En Mantenimiento Durante'}</div>
                    <div style={{display:'flex',gap:4}}>
                      {maintShifts.map(s=><span key={s} style={{background:'#fee2e2',color:'#dc2626',fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:6,border:'1px solid #fecaca'}}>{s}</span>)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ══════════════════════════════════════════
            SECTION 8 — PAINT DEPARTMENT STATUS
        ══════════════════════════════════════════ */}
        <PaintBridgeSection en={en} machRows={machRows} />

      </>)}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   LIVE FLOOR — REAL-TIME STATION FEED
   ══════════════════════════════════════════════════════════════════ */
function LiveFloorSection({en}){
  const[floor,setFloor]=useState({});
  const[sessions,setSessions]=useState([]);
  const[haasData,setHaasData]=useState([]);
  const today=useMemo(()=>new Date().toISOString().slice(0,10),[]);

  const refresh=useCallback(()=>{
    sb.from('station_live').select('*').eq('date',today)
      .then(function(res){

/* ══════════════════════════════════════════════════════════════════
   PAINT DEPARTMENT — FULL TAB VIEW
   ══════════════════════════════════════════════════════════════════ */
const PAINT_COLORS=['Black','Gray','White','Silver','Red','Blue','Green','Yellow','Orange','Custom'];
const PAINT_COLOR_DOT={Black:'#1e293b',Gray:'#6b7280',White:'#e2e8f0',Silver:'#cbd5e1',Red:'#ef4444',Blue:'#3b82f6',Green:'#22c55e',Yellow:'#facc15',Orange:'#f59e0b',Custom:'#a78bfa'};
const BLANK_PAINT_FORM=()=>({direction:'to',partNumber:'',partDescription:'',quantity:'',color:'Black',workOrder:'',operator:'',notes:'',qualityFlag:'good',qtyGood:'',qtyRework:'',qtyReject:''});

function PaintView({lang}){
  const en=lang==='en';
  const[entries,setEntries]=useState([]);
  const[showForm,setShowForm]=useState(false);
  const[form,setForm]=useState(BLANK_PAINT_FORM());
  const[filter,setFilter]=useState('all');
  const[search,setSearch]=useState('');
  const[delId,setDelId]=useState(null);
  const[saving,setSaving]=useState(false);

  /* ── load/sync ── */
  useEffect(()=>{
    const refresh=()=>{
      try{const r=localStorage.getItem('paint_tracker_entries_v2');setEntries(r?JSON.parse(r):[]);}
      catch(e){setEntries([]);}
    };
    refresh();
    const iv=setInterval(refresh,15000);
    window.addEventListener('storage',refresh);
    return()=>{clearInterval(iv);window.removeEventListener('storage',refresh);};
  },[]);

  const persist=(arr)=>{localStorage.setItem('paint_tracker_entries_v2',JSON.stringify(arr));setEntries(arr);};

  const handleAdd=()=>{
    if(!form.partNumber.trim()||!form.quantity)return;
    setSaving(true);
    const qty=parseInt(form.quantity)||0;
    const entry={
      id:Date.now().toString(),ts:new Date().toISOString(),
      direction:form.direction,partNumber:form.partNumber.trim().toUpperCase(),
      partDescription:form.partDescription.trim(),quantity:qty,color:form.color,
      workOrder:form.workOrder.trim(),operator:form.operator.trim(),notes:form.notes.trim(),
      qualityFlag:form.direction==='from'?form.qualityFlag:'good',
      qtyGood:form.direction==='from'?(parseInt(form.qtyGood)||0):qty,
      qtyRework:form.direction==='from'?(parseInt(form.qtyRework)||0):0,
      qtyReject:form.direction==='from'?(parseInt(form.qtyReject)||0):0,
    };
    persist([entry,...entries]);
    setTimeout(()=>{setSaving(false);setShowForm(false);setForm(BLANK_PAINT_FORM());},300);
  };

  const handleDelete=(id)=>{persist(entries.filter(e=>e.id!==id));setDelId(null);};

  /* ── stats ── */
  const today=new Date().toISOString().slice(0,10);
  const allSent=entries.filter(e=>e.direction==='to');
  const allBack=entries.filter(e=>e.direction==='from');
  const todaySent=allSent.filter(e=>e.ts.slice(0,10)===today).reduce((s,e)=>s+(e.quantity||0),0);
  const todayBack=allBack.filter(e=>e.ts.slice(0,10)===today).reduce((s,e)=>s+(e.quantity||0),0);
  const totalSentQty=allSent.reduce((s,e)=>s+(e.quantity||0),0);
  const totalBackQty=allBack.reduce((s,e)=>s+(e.quantity||0),0);
  const atPaint=Math.max(0,totalSentQty-totalBackQty);
  const totalGood=allBack.reduce((s,e)=>s+(e.qtyGood||0),0);
  const totalRework=allBack.reduce((s,e)=>s+(e.qtyRework||0),0);
  const totalReject=allBack.reduce((s,e)=>s+(e.qtyReject||0),0);
  const qualTotal=totalGood+totalRework+totalReject;
  const rejectRate=qualTotal>0?Math.round(totalReject/qualTotal*100):0;

  /* ── pending by part ── */
  const sentByPart={};
  allSent.forEach(e=>{
    if(!sentByPart[e.partNumber])sentByPart[e.partNumber]={qty:0,color:e.color,desc:e.partDescription,lastSent:e.ts};
    sentByPart[e.partNumber].qty+=e.quantity||0;
  });
  const backByPart={};
  allBack.forEach(e=>{
    if(!backByPart[e.partNumber])backByPart[e.partNumber]={qty:0,good:0,rework:0,reject:0};
    backByPart[e.partNumber].qty+=e.quantity||0;
    backByPart[e.partNumber].good+=e.qtyGood||0;
    backByPart[e.partNumber].rework+=e.qtyRework||0;
    backByPart[e.partNumber].reject+=e.qtyReject||0;
  });
  const pending=Object.entries(sentByPart)
    .map(([part,d])=>({part,desc:d.desc,color:d.color,sent:d.qty,back:(backByPart[part]||{}).qty||0,pending:d.qty-((backByPart[part]||{}).qty||0),lastSent:d.lastSent}))
    .filter(x=>x.pending>0)
    .sort((a,b)=>new Date(b.lastSent)-new Date(a.lastSent));

  /* ── filtered log ── */
  const filtered=entries.filter(e=>{
    const matchDir=filter==='all'||e.direction===filter;
    const matchS=!search||e.partNumber.toLowerCase().includes(search.toLowerCase())||e.workOrder.toLowerCase().includes(search.toLowerCase())||(e.partDescription||'').toLowerCase().includes(search.toLowerCase());
    return matchDir&&matchS;
  });

  const fmtTs=(ts)=>{
    const d=new Date(ts);
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  };

  const inputStyle={width:'100%',padding:'9px 12px',fontSize:13,border:'1.5px solid #e2e8f0',borderRadius:10,background:'#f8fafc',color:'#0f172a',outline:'none',fontFamily:'Inter,sans-serif'};
  const labelStyle={fontSize:11,fontWeight:700,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4,display:'block'};

  return(
    <div style={{maxWidth:1600,margin:'0 auto',padding:'22px'}}>

      {/* ── HEADER ── */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:22,flexWrap:'wrap',gap:12}}>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <div style={{width:52,height:52,borderRadius:16,background:'linear-gradient(135deg,#d97706,#f59e0b)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,boxShadow:'0 6px 20px #d9770633'}}>🎨</div>
          <div>
            <div style={{fontSize:22,fontWeight:900,color:'#0f172a',letterSpacing:'-0.02em'}}>{en?'Paint Department Tracker':'Rastreador de Pintura'}</div>
            <div style={{fontSize:12,color:'#94a3b8',marginTop:2}}>{en?`${entries.length} entries · synced with Paint Tracker app`:`${entries.length} entradas · sincronizado`}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>{setForm({...BLANK_PAINT_FORM(),direction:'from'});setShowForm(true);}}
            style={{padding:'10px 20px',background:'linear-gradient(135deg,#16a34a,#22c55e)',border:'none',borderRadius:12,color:'#fff',fontSize:13,fontWeight:800,cursor:'pointer',boxShadow:'0 3px 12px #16a34a44',display:'flex',alignItems:'center',gap:6}}>
            📥 {en?'Log Return':'Registrar Retorno'}
          </button>
          <button onClick={()=>{setForm({...BLANK_PAINT_FORM(),direction:'to'});setShowForm(true);}}
            style={{padding:'10px 20px',background:'linear-gradient(135deg,#d97706,#f59e0b)',border:'none',borderRadius:12,color:'#fff',fontSize:13,fontWeight:800,cursor:'pointer',boxShadow:'0 3px 12px #d9770644',display:'flex',alignItems:'center',gap:6}}>
            📤 {en?'Send to Paint':'Enviar a Pintura'}
          </button>
        </div>
      </div>

      {/* ── KPI CARDS ── */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:14,marginBottom:22}}>
        {[
          {icon:'📤',label:en?'Sent Today':'Enviado Hoy',val:todaySent,c:'#d97706',bg:'linear-gradient(135deg,#fffbeb,#fef9c3)',border:'#fde68a'},
          {icon:'📥',label:en?'Returned Today':'Devuelto Hoy',val:todayBack,c:'#16a34a',bg:'linear-gradient(135deg,#f0fdf4,#dcfce7)',border:'#86efac'},
          {icon:'⏳',label:en?'At Paint Shop':'En Pintura',val:atPaint,c:atPaint>0?'#dc2626':'#64748b',bg:atPaint>0?'linear-gradient(135deg,#fef2f2,#fee2e2)':'linear-gradient(135deg,#f8fafc,#f1f5f9)',border:atPaint>0?'#fca5a5':'#e2e8f0'},
          {icon:'✅',label:en?'Good Parts':'Piezas Buenas',val:totalGood,c:'#16a34a',bg:'linear-gradient(135deg,#f0fdf4,#dcfce7)',border:'#86efac'},
          {icon:'🔄',label:en?'Rework':'Retrabajo',val:totalRework,c:'#d97706',bg:'linear-gradient(135deg,#fffbeb,#fef9c3)',border:'#fde68a'},
          {icon:'❌',label:en?'Reject Rate':'Tasa Rechazo',val:`${rejectRate}%`,c:rejectRate>5?'#dc2626':'#64748b',bg:rejectRate>5?'linear-gradient(135deg,#fef2f2,#fee2e2)':'linear-gradient(135deg,#f8fafc,#f1f5f9)',border:rejectRate>5?'#fca5a5':'#e2e8f0'},
        ].map(({icon,label,val,c,bg,border})=>(
          <div key={label} style={{background:bg,border:`1.5px solid ${border}`,borderRadius:14,padding:'16px 14px',display:'flex',flexDirection:'column',alignItems:'center',gap:6,boxShadow:'0 2px 8px rgba(0,0,0,0.05)'}}>
            <span style={{fontSize:24}}>{icon}</span>
            <div style={{fontSize:26,fontWeight:900,color:c,lineHeight:1}}>{val}</div>
            <div style={{fontSize:10,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.06em',textAlign:'center'}}>{label}</div>
          </div>
        ))}
      </div>

      {/* ── TWO COLUMN: PENDING + QUALITY ── */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18,marginBottom:22}}>

        {/* Pending at Paint */}
        <div style={{background:'#ffffff',borderRadius:16,border:'1.5px solid #fde68a',overflow:'hidden',boxShadow:'0 2px 12px rgba(217,119,6,0.08)'}}>
          <div style={{background:'linear-gradient(135deg,#fffbeb,#fef3c7)',padding:'14px 18px',borderBottom:'1.5px solid #fde68a',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:18}}>⏳</span>
              <div>
                <div style={{fontSize:14,fontWeight:800,color:'#92400e'}}>{en?'Parts Pending at Paint Shop':'Piezas Pendientes en Pintura'}</div>
                <div style={{fontSize:11,color:'#a16207'}}>{pending.length} {en?'part numbers':'números de parte'} · {atPaint} pcs</div>
              </div>
            </div>
            {atPaint>0&&<span style={{background:'#dc2626',color:'#fff',fontSize:11,fontWeight:900,padding:'4px 12px',borderRadius:20}}>{atPaint} pcs</span>}
          </div>
          <div style={{padding:'14px 18px',maxHeight:320,overflowY:'auto'}}>
            {pending.length===0
              ?<div style={{textAlign:'center',padding:'30px 0',color:'#94a3b8'}}><div style={{fontSize:32,marginBottom:8}}>✅</div><div style={{fontWeight:600,fontSize:13}}>{en?'All parts returned!':'¡Todas las piezas devueltas!'}</div></div>
              :pending.map(item=>{
                const dot=PAINT_COLOR_DOT[item.color]||'#94a3b8';
                const pct=item.sent>0?Math.round(item.back/item.sent*100):0;
                const daysSince=Math.floor((Date.now()-new Date(item.lastSent))/86400000);
                return(
                  <div key={item.part} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'#fffbeb',border:'1.5px solid #fde68a',borderRadius:11,marginBottom:8}}>
                    <div style={{width:12,height:12,borderRadius:'50%',background:dot,border:'2px solid #fff',boxShadow:'0 0 0 1px '+dot+'66',flexShrink:0}}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                        <span style={{fontFamily:'monospace',fontWeight:900,fontSize:13,color:'#92400e'}}>{item.part}</span>
                        {daysSince>2&&<span style={{background:'#fee2e2',color:'#dc2626',fontSize:9,fontWeight:800,padding:'1px 6px',borderRadius:6,border:'1px solid #fca5a5'}}>{daysSince}d</span>}
                      </div>
                      {item.desc&&<div style={{fontSize:11,color:'#78716c',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.desc}</div>}
                      <div style={{marginTop:5,height:4,background:'#e2e8f0',borderRadius:4,overflow:'hidden'}}>
                        <div style={{height:'100%',width:`${pct}%`,background:'#22c55e',borderRadius:4,transition:'width 0.4s'}}/>
                      </div>
                    </div>
                    <div style={{textAlign:'right',flexShrink:0}}>
                      <div style={{fontSize:16,fontWeight:900,color:'#d97706'}}>{item.pending}</div>
                      <div style={{fontSize:9,color:'#94a3b8',fontWeight:600}}>{en?'pending':'pendiente'}</div>
                      <div style={{fontSize:9,color:'#94a3b8'}}>{item.back}/{item.sent} {en?'back':'devueltas'}</div>
                    </div>
                  </div>
                );
              })
            }
          </div>
        </div>

        {/* Quality Summary */}
        <div style={{background:'#ffffff',borderRadius:16,border:'1.5px solid #bbf7d0',overflow:'hidden',boxShadow:'0 2px 12px rgba(22,163,74,0.06)'}}>
          <div style={{background:'linear-gradient(135deg,#f0fdf4,#dcfce7)',padding:'14px 18px',borderBottom:'1.5px solid #bbf7d0',display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:18}}>🏆</span>
            <div>
              <div style={{fontSize:14,fontWeight:800,color:'#14532d'}}>{en?'Quality Summary':'Resumen de Calidad'}</div>
              <div style={{fontSize:11,color:'#15803d'}}>{qualTotal} {en?'parts inspected total':'piezas inspeccionadas en total'}</div>
            </div>
          </div>
          <div style={{padding:'18px'}}>
            {qualTotal===0
              ?<div style={{textAlign:'center',padding:'30px 0',color:'#94a3b8'}}><div style={{fontSize:32,marginBottom:8}}>🔍</div><div style={{fontWeight:600,fontSize:13}}>{en?'No returns logged yet':'Sin retornos registrados'}</div></div>
              :<>
                {[
                  {label:en?'Good Parts':'Piezas Buenas',val:totalGood,pct:qualTotal>0?Math.round(totalGood/qualTotal*100):0,c:'#16a34a',bar:'#22c55e',bg:'#f0fdf4',bc:'#bbf7d0',icon:'✅'},
                  {label:en?'Rework Needed':'Necesita Retrabajo',val:totalRework,pct:qualTotal>0?Math.round(totalRework/qualTotal*100):0,c:'#d97706',bar:'#f59e0b',bg:'#fffbeb',bc:'#fde68a',icon:'🔄'},
                  {label:en?'Rejected':'Rechazado',val:totalReject,pct:qualTotal>0?Math.round(totalReject/qualTotal*100):0,c:'#dc2626',bar:'#ef4444',bg:'#fef2f2',bc:'#fecaca',icon:'❌'},
                ].map(({label,val,pct,c,bar,bg,bc,icon})=>(
                  <div key={label} style={{background:bg,border:`1.5px solid ${bc}`,borderRadius:11,padding:'12px 14px',marginBottom:10}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:7}}>
                      <div style={{display:'flex',alignItems:'center',gap:7}}>
                        <span style={{fontSize:16}}>{icon}</span>
                        <span style={{fontSize:13,fontWeight:700,color:c}}>{label}</span>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <span style={{fontSize:20,fontWeight:900,color:c}}>{val}</span>
                        <span style={{fontSize:11,color:c+'99',marginLeft:4,fontWeight:700}}>{pct}%</span>
                      </div>
                    </div>
                    <div style={{height:6,background:'#ffffff',borderRadius:6,overflow:'hidden'}}>
                      <div style={{height:'100%',width:`${pct}%`,background:bar,borderRadius:6,transition:'width 0.5s'}}/>
                    </div>
                  </div>
                ))}
                <div style={{marginTop:14,padding:'12px 14px',background:'#f8fafc',borderRadius:11,border:'1.5px solid #e2e8f0',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <span style={{fontSize:12,fontWeight:700,color:'#64748b'}}>{en?'Overall Reject Rate':'Tasa de Rechazo'}</span>
                  <span style={{fontSize:22,fontWeight:900,color:rejectRate>5?'#dc2626':rejectRate>2?'#d97706':'#16a34a'}}>{rejectRate}%</span>
                </div>
              </>
            }
          </div>
        </div>
      </div>

      {/* ── ACTIVITY LOG ── */}
      <div style={{background:'#ffffff',borderRadius:16,border:'1.5px solid #e2e8f0',overflow:'hidden',boxShadow:'0 2px 12px rgba(0,0,0,0.05)'}}>
        <div style={{background:'linear-gradient(135deg,#f8fafc,#f1f5f9)',padding:'14px 18px',borderBottom:'1.5px solid #e2e8f0',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:18}}>📋</span>
            <div>
              <div style={{fontSize:14,fontWeight:800,color:'#0f172a'}}>{en?'Activity Log':'Registro de Actividad'}</div>
              <div style={{fontSize:11,color:'#94a3b8'}}>{filtered.length} {en?'entries':'entradas'}</div>
            </div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={en?'Search part #, WO...':'Buscar parte, WO...'}
              style={{padding:'7px 12px',border:'1.5px solid #e2e8f0',borderRadius:9,fontSize:12,background:'#f8fafc',color:'#0f172a',outline:'none',width:180}}/>
            {['all','to','from'].map(f=>(
              <button key={f} onClick={()=>setFilter(f)}
                style={{padding:'6px 14px',borderRadius:9,border:`1.5px solid ${filter===f?'#d97706':'#e2e8f0'}`,background:filter===f?'linear-gradient(135deg,#d97706,#f59e0b)':'#f8fafc',color:filter===f?'#fff':'#64748b',fontSize:12,fontWeight:700,cursor:'pointer'}}>
                {f==='all'?(en?'All':'Todos'):f==='to'?(en?'Sent':'Enviado'):(en?'Returned':'Devuelto')}
              </button>
            ))}
          </div>
        </div>
        <div style={{overflowX:'auto'}}>
          {filtered.length===0
            ?<div style={{textAlign:'center',padding:'40px',color:'#94a3b8'}}><div style={{fontSize:36,marginBottom:10}}>📋</div><div style={{fontWeight:600}}>{en?'No entries found':'Sin entradas'}</div></div>
            :<table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{background:'#f8fafc',borderBottom:'1.5px solid #e2e8f0'}}>
                  {[en?'Date/Time':'Fecha',en?'Direction':'Dirección',en?'Part #':'Parte',en?'Description':'Descripción',en?'Color':'Color',en?'Qty':'Cant.',en?'Good/Rework/Reject':'Buenas/Retrabajo/Rechazadas',en?'Work Order':'Orden',en?'Operator':'Operador',en?'Notes':'Notas',''].map(h=>(
                    <th key={h} style={{padding:'9px 12px',fontWeight:700,color:'#64748b',textAlign:'left',fontSize:10,textTransform:'uppercase',letterSpacing:'0.06em',whiteSpace:'nowrap'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map((e,i)=>{
                  const isSent=e.direction==='to';
                  const dot=PAINT_COLOR_DOT[e.color]||'#94a3b8';
                  return(
                    <tr key={e.id} style={{borderBottom:'1px solid #f1f5f9',background:i%2===0?'#ffffff':'#f8fafc',transition:'background 0.15s'}}
                      onMouseEnter={ev=>ev.currentTarget.style.background='#eff6ff'}
                      onMouseLeave={ev=>ev.currentTarget.style.background=i%2===0?'#ffffff':'#f8fafc'}>
                      <td style={{padding:'10px 12px',color:'#64748b',whiteSpace:'nowrap',fontWeight:500}}>{fmtTs(e.ts)}</td>
                      <td style={{padding:'10px 12px'}}>
                        <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 10px',borderRadius:20,fontWeight:800,fontSize:11,background:isSent?'#fffbeb':'#f0fdf4',color:isSent?'#d97706':'#16a34a',border:`1.5px solid ${isSent?'#fde68a':'#bbf7d0'}`}}>
                          {isSent?'📤':'📥'} {isSent?(en?'Sent':'Enviado'):(en?'Returned':'Devuelto')}
                        </span>
                      </td>
                      <td style={{padding:'10px 12px',fontFamily:'monospace',fontWeight:900,color:'#0f172a',fontSize:13}}>{e.partNumber}</td>
                      <td style={{padding:'10px 12px',color:'#475569',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.partDescription||'—'}</td>
                      <td style={{padding:'10px 12px'}}>
                        <div style={{display:'flex',alignItems:'center',gap:5}}>
                          <div style={{width:10,height:10,borderRadius:'50%',background:dot,border:'1px solid #e2e8f0',boxShadow:`0 0 0 1px ${dot}55`,flexShrink:0}}/>
                          <span style={{fontSize:11,color:'#64748b',fontWeight:600}}>{e.color}</span>
                        </div>
                      </td>
                      <td style={{padding:'10px 12px',fontWeight:900,fontSize:14,color:'#0f172a'}}>{e.quantity}</td>
                      <td style={{padding:'10px 12px'}}>
                        {isSent?<span style={{color:'#94a3b8',fontSize:11}}>—</span>:(
                          <div style={{display:'flex',gap:6,alignItems:'center'}}>
                            <span style={{color:'#16a34a',fontWeight:800}}>{e.qtyGood||0}</span>
                            <span style={{color:'#94a3b8'}}>/</span>
                            <span style={{color:'#d97706',fontWeight:800}}>{e.qtyRework||0}</span>
                            <span style={{color:'#94a3b8'}}>/</span>
                            <span style={{color:'#dc2626',fontWeight:800}}>{e.qtyReject||0}</span>
                          </div>
                        )}
                      </td>
                      <td style={{padding:'10px 12px',color:'#64748b',fontFamily:'monospace',fontWeight:600,fontSize:11}}>{e.workOrder||'—'}</td>
                      <td style={{padding:'10px 12px',color:'#64748b',fontWeight:600}}>{e.operator||'—'}</td>
                      <td style={{padding:'10px 12px',color:'#94a3b8',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.notes||'—'}</td>
                      <td style={{padding:'10px 8px'}}>
                        <button onClick={()=>setDelId(e.id)} style={{padding:'4px 8px',background:'#fef2f2',border:'1.5px solid #fecaca',borderRadius:7,color:'#dc2626',fontSize:11,fontWeight:700,cursor:'pointer'}}>✕</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          }
        </div>
      </div>

      {/* ── ENTRY FORM MODAL ── */}
      {showForm&&(
        <div onClick={()=>setShowForm(false)} style={{position:'fixed',inset:0,background:'rgba(15,23,42,0.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,backdropFilter:'blur(6px)'}}>
          <div onClick={e=>e.stopPropagation()} style={{background:'#ffffff',borderRadius:24,padding:32,width:560,maxWidth:'95vw',maxHeight:'90vh',overflowY:'auto',boxShadow:'0 24px 60px rgba(0,0,0,0.18)',border:'1.5px solid #e2e8f0'}}>

            {/* Modal header */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:22}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:44,height:44,borderRadius:13,background:form.direction==='to'?'linear-gradient(135deg,#d97706,#f59e0b)':'linear-gradient(135deg,#16a34a,#22c55e)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>
                  {form.direction==='to'?'📤':'📥'}
                </div>
                <div>
                  <div style={{fontSize:18,fontWeight:900,color:'#0f172a'}}>{form.direction==='to'?(en?'Send to Paint':'Enviar a Pintura'):(en?'Return from Paint':'Retorno de Pintura')}</div>
                  <div style={{fontSize:11,color:'#94a3b8',marginTop:1}}>{en?'Log a new entry':'Registrar nueva entrada'}</div>
                </div>
              </div>
              <button onClick={()=>setShowForm(false)} style={{width:32,height:32,borderRadius:'50%',border:'1.5px solid #e2e8f0',background:'#f8fafc',color:'#94a3b8',fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}}>×</button>
            </div>

            {/* Direction toggle */}
            <div style={{display:'flex',gap:8,marginBottom:20,background:'#f8fafc',padding:5,borderRadius:12,border:'1.5px solid #e2e8f0'}}>
              {['to','from'].map(d=>(
                <button key={d} onClick={()=>setForm(f=>({...f,direction:d}))}
                  style={{flex:1,padding:'10px',borderRadius:9,border:'none',background:form.direction===d?(d==='to'?'linear-gradient(135deg,#d97706,#f59e0b)':'linear-gradient(135deg,#16a34a,#22c55e)'):'transparent',color:form.direction===d?'#fff':'#64748b',fontSize:13,fontWeight:800,cursor:'pointer',transition:'all 0.15s'}}>
                  {d==='to'?`📤 ${en?'Send to Paint':'Enviar a Pintura'}`:`📥 ${en?'Return from Paint':'Retorno de Pintura'}`}
                </button>
              ))}
            </div>

            {/* Form fields */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
              <div style={{gridColumn:'1/-1'}}>
                <label style={labelStyle}>{en?'Part Number *':'Número de Parte *'}</label>
                <input value={form.partNumber} onChange={e=>setForm(f=>({...f,partNumber:e.target.value}))} placeholder={en?'e.g. ABC-1234':'ej. ABC-1234'} style={{...inputStyle,fontFamily:'monospace',fontWeight:700,fontSize:14,textTransform:'uppercase'}}/>
              </div>
              <div style={{gridColumn:'1/-1'}}>
                <label style={labelStyle}>{en?'Part Description':'Descripción de Pieza'}</label>
                <input value={form.partDescription} onChange={e=>setForm(f=>({...f,partDescription:e.target.value}))} placeholder={en?'Part name...':'Nombre de pieza...'} style={inputStyle}/>
              </div>
              <div>
                <label style={labelStyle}>{en?'Quantity *':'Cantidad *'}</label>
                <input type="number" min="1" value={form.quantity} onChange={e=>setForm(f=>({...f,quantity:e.target.value}))} placeholder="0" style={inputStyle}/>
              </div>
              <div>
                <label style={labelStyle}>{en?'Paint Color':'Color de Pintura'}</label>
                <select value={form.color} onChange={e=>setForm(f=>({...f,color:e.target.value}))} style={inputStyle}>

/* =====================================================================
   SPC  -  statistical process control
   Maths verified against hand calculations before wiring to the UI.
   ===================================================================== */
const SPC_D2 = 1.128, SPC_E2 = 2.66, SPC_D4 = 3.267;

function spcPChart(groups){
  let totD=0, totN=0;
  groups.forEach(g=>{ totD+=g.defectives; totN+=g.n; });
  if(totN<=0) return null;
  const pbar=totD/totN;
  const points=groups.map(g=>{
    const sd=g.n>0?Math.sqrt(pbar*(1-pbar)/g.n):0;
    let ucl=pbar+3*sd, lcl=pbar-3*sd;
    if(lcl<0) lcl=0; if(ucl>1) ucl=1;
    const p=g.n>0?g.defectives/g.n:0;
    return {...g, p, ucl, lcl, sigma:sd,
      beyond: p>ucl?'above':(p < lcl?'below':null),
      z: sd>0?(p-pbar)/sd:0};
  });
  return {centre:pbar, points, totalN:totN, totalD:totD};
}

function spcIMR(values, resolution){
  const n=values.length;
  if(n<2) return null;
  const mr=[];
  for(let i=1;i < n;i++) mr.push(Math.abs(values[i]-values[i-1]));
  const xbar=values.reduce((a,b)=>a+b,0)/n;
  const mrbar=mr.reduce((a,b)=>a+b,0)/mr.length;
  const sigma=mrbar/SPC_D2;
  const res=resolution||0;
  const degenerate = res>0 && sigma < res/SPC_D2;
  return {n, centre:xbar, mrbar, sigma,
    ucl:xbar+SPC_E2*mrbar, lcl:xbar-SPC_E2*mrbar,
    mrCentre:mrbar, mrUcl:SPC_D4*mrbar, mrLcl:0, mr, degenerate,
    reason: degenerate
      ? `Variation (${sigma.toFixed(3)}s) is smaller than a ${res}s measurement can resolve. `
        +`Limits would flag every point, so they are not drawn. Run rules still apply.`
      : null};
}

function spcNelson(values, centre, ucl, lcl, opts){
  opts=opts||{};
  const out=[], n=values.length;
  if(!opts.skipRule1){
    for(let i=0;i < n;i++)
      if(values[i]>ucl||values[i] < lcl)
        out.push({rule:1,index:i,value:values[i],text:'Point outside the control limits'});
  }
  let run=0, side=0;
  for(let i=0;i < n;i++){
    const s=values[i]>centre?1:(values[i] < centre?-1:0);
    if(s!==0&&s===side) run++; else { run=s===0?0:1; side=s; }
    if(run===9) out.push({rule:2,index:i,value:values[i],
      text:`Nine in a row ${side>0?'above':'below'} the centre line - the process has shifted`});
  }
  let up=0,dn=0;
  for(let i=1;i < n;i++){
    if(values[i]>values[i-1]){up++;dn=0;}
    else if(values[i] < values[i-1]){dn++;up=0;}
    else {up=0;dn=0;}
    if(up===5) out.push({rule:3,index:i,value:values[i],text:'Six points rising - a trend'});
    if(dn===5) out.push({rule:3,index:i,value:values[i],text:'Six points falling - a trend'});
  }
  return out;
}

function spcPareto(rows, keyField, valField){
  const agg={};
  rows.forEach(r=>{ const k=r[keyField]||'Unknown';
    agg[k]=(agg[k]||0)+(Number(r[valField])||0); });
  const items=Object.keys(agg).map(k=>({key:k,value:agg[k]}))
    .sort((a,b)=>b.value-a.value);
  const total=items.reduce((a,b)=>a+b.value,0);
  let cum=0;
  items.forEach(x=>{ x.pct=total>0?x.value/total*100:0; cum+=x.pct; x.cumPct=cum; });
  return {total, items};
}

function spcLongCycles(values, factor){
  factor=factor||1.5;
  if(!values.length) return {mode:null,threshold:null,hits:[]};
  const counts={};
  values.forEach(v=>counts[v]=(counts[v]||0)+1);
  let mode=null,best=-1;
  Object.keys(counts).forEach(k=>{ if(counts[k]>best){best=counts[k];mode=Number(k);} });
  const threshold=mode*factor, hits=[];
  values.forEach((v,i)=>{ if(v>threshold) hits.push({index:i,value:v}); });
  return {mode,threshold,hits};
}

/* ---------- chart canvas ---------- */
function SPCChart({points, centre, ucl, lcl, target, label, unit, onPick,
                   varyingLimits, degenerate, height}){
  const H=height||230, W=860, PAD={l:56,r:16,t:16,b:40};
  const iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  if(!points.length) return <div style={{padding:'28px',color:'#94a3b8',fontSize:13,
    textAlign:'center'}}>Not enough data yet for this chart.</div>;

  const ys=points.map(p=>p.y);
  const lim=[];
  if(!degenerate){ if(isFinite(ucl))lim.push(ucl); if(isFinite(lcl))lim.push(lcl); }
  if(target!=null) lim.push(target);
  points.forEach(p=>{ if(p.ucl!=null&&!degenerate)lim.push(p.ucl);
                      if(p.lcl!=null&&!degenerate)lim.push(p.lcl); });
  let lo=Math.min(...ys,...lim), hi=Math.max(...ys,...lim);
  if(lo===hi){ lo-=1; hi+=1; }
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;

  const X=i=>PAD.l+(points.length<=1?iw/2:(i/(points.length-1))*iw);
  const Y=v=>PAD.t+ih-((v-lo)/(hi-lo))*ih;

  const ticks=4;
  const grid=Array.from({length:ticks+1},(_,k)=>lo+(hi-lo)*k/ticks);
  const linePath=points.map((p,i)=>`${i?'L':'M'}${X(i)},${Y(p.y)}`).join(' ');

  let bandPath=null;
  if(varyingLimits&&!degenerate){
    const up=points.map((p,i)=>`${i?'L':'M'}${X(i)},${Y(p.ucl)}`).join(' ');
    const dn=points.slice().reverse()
      .map((p,i)=>`L${X(points.length-1-i)},${Y(p.lcl)}`).join(' ');
    bandPath=up+' '+dn+' Z';
  }

  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
      {grid.map((g,i)=>(
        <g key={i}>
          <line x1={PAD.l} y1={Y(g)} x2={W-PAD.r} y2={Y(g)} stroke="#f1f5f9" strokeWidth="1"/>
          <text x={PAD.l-8} y={Y(g)+4} textAnchor="end" fontSize="10"
            fill="#94a3b8">{unit==='%'?(g*100).toFixed(1):g.toFixed(g<10?2:0)}</text>
        </g>
      ))}

      {bandPath&&<path d={bandPath} fill="#fecaca" opacity="0.28"/>}

      {!degenerate&&!varyingLimits&&isFinite(ucl)&&(
        <g>
          <line x1={PAD.l} y1={Y(ucl)} x2={W-PAD.r} y2={Y(ucl)} stroke="#dc2626"
            strokeWidth="1.5" strokeDasharray="6 4"/>
          <text x={W-PAD.r} y={Y(ucl)-5} textAnchor="end" fontSize="10"
            fill="#dc2626" fontWeight="700">UCL {unit==='%'?(ucl*100).toFixed(2)+'%':ucl.toFixed(2)}</text>
        </g>
      )}
      {!degenerate&&!varyingLimits&&isFinite(lcl)&&lcl>lo&&(
        <g>
          <line x1={PAD.l} y1={Y(lcl)} x2={W-PAD.r} y2={Y(lcl)} stroke="#dc2626"
            strokeWidth="1.5" strokeDasharray="6 4"/>
          <text x={W-PAD.r} y={Y(lcl)+13} textAnchor="end" fontSize="10"
            fill="#dc2626" fontWeight="700">LCL {unit==='%'?(lcl*100).toFixed(2)+'%':lcl.toFixed(2)}</text>
        </g>
      )}

      <line x1={PAD.l} y1={Y(centre)} x2={W-PAD.r} y2={Y(centre)} stroke="#2563eb"
        strokeWidth="1.5"/>
      <text x={W-PAD.r} y={Y(centre)-5} textAnchor="end" fontSize="10" fill="#2563eb"
        fontWeight="700">CL {unit==='%'?(centre*100).toFixed(2)+'%':centre.toFixed(2)}</text>

      {target!=null&&(
        <g>
          <line x1={PAD.l} y1={Y(target)} x2={W-PAD.r} y2={Y(target)} stroke="#16a34a"
            strokeWidth="1.5" strokeDasharray="2 3"/>
          <text x={PAD.l+4} y={Y(target)-5} fontSize="10" fill="#16a34a"
            fontWeight="700">TARGET {unit==='%'?(target*100).toFixed(1)+'%':target.toFixed(1)}</text>
        </g>
      )}

      <path d={linePath} fill="none" stroke="#0f172a" strokeWidth="1.6"/>

      {points.map((p,i)=>{
        const bad=p.violation;
        return(
          <g key={i} onClick={()=>onPick&&onPick(p,i)} style={{cursor:'pointer'}}>
            <circle cx={X(i)} cy={Y(p.y)} r={bad?6:4}
              fill={bad?'#dc2626':'#0f172a'} stroke="#fff" strokeWidth="1.5"/>
            {bad&&<circle cx={X(i)} cy={Y(p.y)} r="10" fill="none"
              stroke="#dc2626" strokeWidth="1.5" opacity="0.45"/>}
            <title>{p.label}: {unit==='%'?(p.y*100).toFixed(2)+'%':p.y.toFixed(2)+(unit||'')}</title>
          </g>
        );
      })}

      {points.map((p,i)=>{
        const every=Math.max(1,Math.ceil(points.length/9));
        if(i%every!==0&&i!==points.length-1) return null;
        return <text key={'x'+i} x={X(i)} y={H-14} textAnchor="middle" fontSize="9"
          fill="#94a3b8">{p.short||p.label}</text>;
      })}
      <text x={6} y={12} fontSize="10" fill="#64748b" fontWeight="700">{label}</text>
    </svg>
  );
}

/* ===================== PRODUCTION SPC VIEW ===================== */
function SPCView({t}){
  const[tab,setTab]=useState('scrap');
  const[from,setFrom]=useState(()=>{const d=new Date();d.setDate(d.getDate()-30);
    return d.toISOString().slice(0,10);});
  const[to,setTo]=useState(()=>new Date().toISOString().slice(0,10));
  const[fMachine,setFMachine]=useState('');
  const[fPart,setFPart]=useState('');
  const[fShift,setFShift]=useState('');
  const[scrap,setScrap]=useState([]);
  const[cycle,setCycle]=useState([]);
  const[down,setDown]=useState([]);
  const[alerts,setAlerts]=useState([]);
  const[loading,setLoading]=useState(true);
  const[pick,setPick]=useState(null);
  const[raw,setRaw]=useState([]);
  const[editAlert,setEditAlert]=useState(null);

  const load=useCallback(()=>{
    setLoading(true);
    Promise.all([
      sb.from('v_spc_scrap').select('*').gte('shift_date',from).lte('shift_date',to)
        .order('shift_date').limit(5000),
      sb.from('v_spc_cycle').select('*').gte('shift_date',from).lte('shift_date',to)
        .order('shift_date').limit(5000),
      sb.from('v_spc_downtime').select('*').gte('shift_date',from).lte('shift_date',to)
        .order('start_time').limit(3000),
      sb.from('spc_alerts').select('*').order('shift_date',{ascending:false}).limit(300),
    ]).then(([a,b,c2,d])=>{
      setScrap(a.data||[]); setCycle(b.data||[]);
      setDown(c2.data||[]); setAlerts(d.data||[]);
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[from,to]);
  useEffect(()=>{load();},[load]);

  /* ---------- filter options ---------- */
  const machines=[...new Set([...scrap.map(r=>r.station),
    ...cycle.map(r=>r.machine_id), ...down.map(r=>r.machine_id)])].filter(Boolean).sort();
  const parts=[...new Set([...scrap.map(r=>r.part), ...cycle.map(r=>r.part)])]
    .filter(Boolean).sort();

  const fScrap=scrap.filter(r=>
    (!fMachine||r.station===fMachine)&&(!fPart||r.part===fPart)&&
    (!fShift||String(r.shift_number)===fShift));
  const fCycle=cycle.filter(r=>
    (!fMachine||r.machine_id===fMachine)&&(!fPart||r.part===fPart)&&
    (!fShift||r.shift_name===shiftNameOf(fShift)));
  const fDown=down.filter(r=>
    (!fMachine||r.machine_id===fMachine)&&
    (!fShift||String(r.shift_number)===fShift));

  function shiftNameOf(n){
    return n==='1'?'1st Shift':n==='2'?'2nd Shift':n==='3'?'3rd Shift':'';
  }

  /* ---------- SCRAP p-chart ---------- */
  const scrapGroups=fScrap.map(r=>({
    key:`${r.shift_date}|${r.shift_number}|${r.station}|${r.part}`,
    label:`${r.shift_date} S${r.shift_number} ${r.station}`,
    short:r.shift_date.slice(5),
    n:Number(r.n), defectives:Number(r.defectives),
    meta:r}));
  const pRes=scrapGroups.length?spcPChart(scrapGroups):null;
  const pPoints=pRes?pRes.points.map(p=>({
    ...p, y:p.p, violation:!!p.beyond})):[];
  const pViol=pRes?spcNelson(pPoints.map(p=>p.y),pRes.centre,
    Math.max(...pPoints.map(p=>p.ucl)),Math.min(...pPoints.map(p=>p.lcl)),
    {skipRule1:true}):[];

  /* ---------- CYCLE I-MR, one baseline per part+machine ---------- */
  const cycleKeys=[...new Set(fCycle.map(r=>`${r.part}|||${r.machine_id}`))];
  const cycleCharts=cycleKeys.map(k=>{
    const[part,machine]=k.split('|||');
    const rows=fCycle.filter(r=>r.part===part&&r.machine_id===machine)
      .sort((a,b)=>(a.shift_date+a.shift_name).localeCompare(b.shift_date+b.shift_name));
    const vals=rows.map(r=>Number(r.median_cycle));
    const imr=spcIMR(vals,1);
    const viol=imr?spcNelson(vals,imr.centre,imr.ucl,imr.lcl,
      {skipRule1:imr.degenerate}):[];
    const vset=new Set(viol.map(v=>v.index));
    return {part,machine,rows,vals,imr,viol,
      points:rows.map((r,i)=>({y:vals[i],
        label:`${r.shift_date} ${r.shift_name}`, short:r.shift_date.slice(5),
        violation:vset.has(i), meta:r}))};
  }).filter(c2=>c2.imr);

  /* ---------- DOWNTIME ---------- */
  const downByDay={};
  fDown.forEach(r=>{ downByDay[r.shift_date]=(downByDay[r.shift_date]||0)
    +Number(r.duration_seconds||0); });
  const downDays=Object.keys(downByDay).sort();
  const downVals=downDays.map(d=>downByDay[d]/60);
  const downImr=downVals.length>=2?spcIMR(downVals,0):null;
  const downViol=downImr?spcNelson(downVals,downImr.centre,downImr.ucl,downImr.lcl,{}):[];
  const dvset=new Set(downViol.map(v=>v.index));
  const downPoints=downDays.map((d,i)=>({y:downVals[i],label:d,short:d.slice(5),
    violation:dvset.has(i),meta:{date:d,minutes:downVals[i]}}));
  const par=spcPareto(fDown,'reason','duration_seconds');

  /* ---------- raising an alert ---------- */
  function raise(metric,rule,point,extra){
    const row={
      id:String(Date.now())+Math.floor(Math.random()*10000),
      metric, rule,
      subgroup_key:(point&&point.key)||(extra&&extra.key)||'',
      shift_date:(point&&point.meta&&point.meta.shift_date)||(extra&&extra.date)||null,
      machine_id:(point&&point.meta&&(point.meta.station||point.meta.machine_id))||null,
      part:(point&&point.meta&&point.meta.part)||null,
      observed:point?Number(point.y):null,
      centre_line:extra?extra.centre:null,
      ucl:extra?extra.ucl:null, lcl:extra?extra.lcl:null,
      detail:(extra&&extra.detail)||'',
      status:'open', owner:'', action_notes:''};
    sb.from('spc_alerts').upsert(row,
      {onConflict:'metric,subgroup_key,shift_date,rule'})
      .then(()=>{ load(); setEditAlert(row); })
      .catch(()=>{});
  }
  function saveAlert(a){
    sb.from('spc_alerts').update({owner:a.owner,status:a.status,
      action_notes:a.action_notes,
      closed_at:a.status==='closed'?new Date().toISOString():null})
      .eq('id',a.id).then(()=>{ setEditAlert(null); load(); }).catch(()=>{});
  }

  function openRaw(p){
    setPick(p);
    if(tab==='cycle'&&p.meta){
      sb.from('v_spc_cycle_raw').select('*')
        .eq('shift_date',p.meta.shift_date).eq('machine_id',p.meta.machine_id)
        .eq('part',p.meta.part).order('record_time').limit(400)
        .then(r=>setRaw(r.data||[])).catch(()=>setRaw([]));
    } else if(tab==='downtime'&&p.meta){
      setRaw(fDown.filter(d=>d.shift_date===p.meta.date));
    } else if(p.meta){
      setRaw([p.meta]);
    }
  }

  const card={background:'#fff',border:'1px solid #e2e8f0',borderRadius:14,
    padding:'16px 18px',marginBottom:14,boxShadow:'0 1px 4px rgba(0,0,0,.05)'};
  const inp={padding:'7px 10px',fontSize:12,fontWeight:600,border:'1.5px solid #e2e8f0',
    borderRadius:9,outline:'none',background:'#fff'};
  const SUB=[{k:'scrap',l:'Scrap rate'},{k:'cycle',l:'Cycle time'},
             {k:'downtime',l:'Downtime'},{k:'alerts',l:`Alerts (${alerts.filter(a=>a.status!=='closed').length})`}];

  return(
    <div style={{maxWidth:1600,margin:'0 auto',padding:'22px'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:18}}>
        <div style={{width:40,height:40,borderRadius:12,
          background:'linear-gradient(135deg,#0f766e,#14b8a6)',display:'flex',
          alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:900,
          color:'#fff'}}>SPC</div>
        <div>
          <div style={{fontSize:18,fontWeight:800}}>Production SPC</div>
          <div style={{fontSize:12,color:'#94a3b8'}}>
            Control limits are calculated from your data. Targets are shown separately.</div>
        </div>
        <button onClick={load} style={{marginLeft:'auto',padding:'8px 16px',borderRadius:9,
          border:'1.5px solid #e2e8f0',background:'#fff',fontSize:12,fontWeight:700,
          cursor:'pointer'}}>{loading?'Loading...':'Refresh'}</button>
      </div>

      <div style={{...card,display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
        <span style={{fontSize:11,fontWeight:800,color:'#64748b',
          textTransform:'uppercase',letterSpacing:.5}}>Filters</span>
        <input type="date" value={from} onChange={e=>setFrom(e.target.value)} style={inp}/>
        <span style={{color:'#cbd5e1'}}>to</span>
        <input type="date" value={to} onChange={e=>setTo(e.target.value)} style={inp}/>
        <select value={fMachine} onChange={e=>setFMachine(e.target.value)} style={inp}>
          <option value="">All machines</option>
          {machines.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
        <select value={fPart} onChange={e=>setFPart(e.target.value)} style={inp}>
          <option value="">All parts</option>
          {parts.slice(0,400).map(p=><option key={p} value={p}>{p}</option>)}
        </select>
        <select value={fShift} onChange={e=>setFShift(e.target.value)} style={inp}>
          <option value="">All shifts</option>
          <option value="1">1st</option><option value="2">2nd</option>
          <option value="3">3rd</option>
        </select>
        {(fMachine||fPart||fShift)&&(
          <button onClick={()=>{setFMachine('');setFPart('');setFShift('');}}
            style={{...inp,cursor:'pointer',color:'#dc2626',
              borderColor:'#fecaca',background:'#fef2f2'}}>Clear</button>
        )}
      </div>

      <div style={{display:'flex',gap:6,marginBottom:16}}>

                    <span style={{fontSize:12,fontWeight:700,color:'#2563eb'}}>{ch.machine}</span>
                    <span style={{fontSize:11.5,color:'#94a3b8'}}>
                      {ch.imr.n} shifts &middot; centre {ch.imr.centre.toFixed(1)}s
                      &middot; MR-bar {ch.imr.mrbar.toFixed(2)}</span>
                  </div>
                  {ch.imr.degenerate&&(
                    <div style={{background:'#fffbeb',border:'1px solid #fde68a',
                      borderRadius:9,padding:'10px 12px',marginBottom:10,fontSize:11.5,
                      color:'#92400e',lineHeight:1.5}}>
                      <b>Control limits not drawn.</b> {ch.imr.reason}
                    </div>
                  )}
                  <SPCChart points={ch.points} centre={ch.imr.centre}
                    ucl={ch.imr.ucl} lcl={ch.imr.lcl} unit="s"
                    degenerate={ch.imr.degenerate}
                    label="median cycle, seconds" onPick={openRaw} height={220}/>
                  {ch.viol.length>0&&(
                    <div style={{marginTop:10,paddingTop:10,borderTop:'1px solid #f1f5f9'}}>
                      {ch.viol.map((v,i)=>(
                        <div key={i} style={{display:'flex',alignItems:'center',gap:10,
                          fontSize:12,color:'#b91c1c',marginTop:6}}>
                          <b>Rule {v.rule}</b><span style={{flex:1}}>{v.text}</span>
                          <button onClick={()=>raise('cycle','Rule '+v.rule,
                            ch.points[v.index],
                            {centre:ch.imr.centre,ucl:ch.imr.ucl,lcl:ch.imr.lcl,
                             key:ch.part+'|'+ch.machine,
                             detail:ch.part+' on '+ch.machine+': '+v.text})}
                            style={{padding:'5px 11px',borderRadius:8,border:'none',
                              background:'#dc2626',color:'#fff',fontSize:11,
                              fontWeight:800,cursor:'pointer'}}>Raise alert</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* ---------------- DOWNTIME ---------------- */}
      {tab==='downtime'&&(
        <div>
          {!fDown.length ? (
            <div style={card}><div style={{color:'#94a3b8',fontSize:13,padding:'24px',
              textAlign:'center'}}>No downtime recorded in this range.</div></div>
          ) : (
          <div>
            <div style={card}>
              <div style={{display:'flex',alignItems:'baseline',gap:14,marginBottom:10}}>
                <b style={{fontSize:14}}>Downtime per day</b>
                <span style={{fontSize:11.5,color:'#94a3b8'}}>
                  {fDown.length} stoppages &middot;
                  {' '}{(fDown.reduce((a,b)=>a+Number(b.duration_seconds||0),0)/3600).toFixed(1)} hours total</span>
              </div>
              {downImr
                ? <SPCChart points={downPoints} centre={downImr.centre}
                    ucl={downImr.ucl} lcl={downImr.lcl} unit="m"
                    label="minutes lost per day" onPick={openRaw} height={220}/>
                : <div style={{color:'#94a3b8',fontSize:13,padding:'20px'}}>
                    Need at least two days of data for a trend.</div>}
            </div>

            <div style={card}>
              <b style={{fontSize:14}}>Why machines stopped</b>
              <div style={{fontSize:11.5,color:'#64748b',margin:'4px 0 14px'}}>
                Sorted by time lost. The few reasons on the left are usually most of the problem.
              </div>
              {par.items.slice(0,12).map((it,i)=>(
                <div key={it.key} style={{marginBottom:12}}>
                  <div style={{display:'flex',justifyContent:'space-between',
                    fontSize:12.5,marginBottom:5}}>
                    <span style={{fontWeight:700,color:'#475569',flex:1,minWidth:0,
                      overflow:'hidden',textOverflow:'ellipsis',
                      whiteSpace:'nowrap'}}>{i+1}. {it.key}</span>
                    <span style={{flexShrink:0}}>
                      <b style={{color:'#dc2626'}}>{(it.value/60).toFixed(0)} min</b>
                      <span style={{color:'#94a3b8',marginLeft:8}}>{it.pct.toFixed(0)}%</span>
                      <span style={{color:'#cbd5e1',marginLeft:8}}>cum {it.cumPct.toFixed(0)}%</span>
                    </span>
                  </div>
                  <div style={{height:8,background:'#f1f5f9',borderRadius:10,
                    overflow:'hidden'}}>
                    <div style={{height:'100%',width:it.pct+'%',borderRadius:10,
                      background:it.cumPct<=80?'#dc2626':'#fca5a5'}}/>
                  </div>
                </div>
              ))}
              <div style={{fontSize:11,color:'#cbd5e1',marginTop:10}}>
                Red bars make up the first 80% of lost time - fix those first.
              </div>
            </div>
          </div>
          )}
        </div>
      )}

      {/* ---------------- ALERTS ---------------- */}
      {tab==='alerts'&&(
        <div>
          {!alerts.length ? (
            <div style={card}><div style={{color:'#94a3b8',fontSize:13,padding:'24px',
              textAlign:'center'}}>No alerts raised yet. Raise one from a chart when
              something looks wrong.</div></div>
          ) : alerts.map(a=>(
            <div key={a.id} style={{...card,
              borderColor:a.status==='closed'?'#e2e8f0':'#fca5a5',
              background:a.status==='closed'?'#f8fafc':'#fff',
              opacity:a.status==='closed'?.7:1}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,
                flexWrap:'wrap'}}>
                <span style={{fontSize:10,fontWeight:800,padding:'3px 9px',borderRadius:6,
                  background:a.metric==='scrap'?'#fef2f2':a.metric==='cycle'?'#eff6ff':'#fffbeb',
                  color:a.metric==='scrap'?'#dc2626':a.metric==='cycle'?'#2563eb':'#d97706',
                  textTransform:'uppercase'}}>{a.metric}</span>
                <b style={{fontSize:13}}>{a.rule}</b>
                <span style={{fontSize:11.5,color:'#94a3b8'}}>
                  {a.shift_date}{a.machine_id?' · '+a.machine_id:''}{a.part?' · '+a.part:''}</span>
                <span style={{marginLeft:'auto',fontSize:10,fontWeight:800,padding:'3px 9px',
                  borderRadius:6,textTransform:'uppercase',
                  background:a.status==='open'?'#fef2f2':a.status==='investigating'?'#fffbeb':'#f0fdf4',
                  color:a.status==='open'?'#dc2626':a.status==='investigating'?'#d97706':'#16a34a'}}>
                  {a.status}</span>
              </div>
              {a.detail&&<div style={{fontSize:12.5,color:'#475569',
                marginBottom:8}}>{a.detail}</div>}
              {a.observed!=null&&(
                <div style={{fontSize:11.5,color:'#94a3b8',marginBottom:8}}>
                  observed {Number(a.observed).toFixed(3)}
                  {a.centre_line!=null?`  ·  centre ${Number(a.centre_line).toFixed(3)}`:''}
                  {a.ucl!=null?`  ·  UCL ${Number(a.ucl).toFixed(3)}`:''}
                </div>
              )}
              <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',
                paddingTop:10,borderTop:'1px solid #f1f5f9'}}>
                <span style={{fontSize:11.5,color:'#64748b'}}>Owner:
                  <b style={{color:'#0f172a',marginLeft:6}}>{a.owner||'unassigned'}</b></span>
                {a.action_notes&&<span style={{fontSize:11.5,color:'#475569',flex:1,
                  minWidth:0}}>{a.action_notes}</span>}
                <button onClick={()=>setEditAlert(a)}
                  style={{marginLeft:'auto',padding:'6px 14px',borderRadius:8,
                    border:'1.5px solid #e2e8f0',background:'#fff',fontSize:11.5,
                    fontWeight:700,cursor:'pointer'}}>
                  {a.owner?'Update':'Assign owner'}</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ---------------- drill-down ---------------- */}
      {pick&&(
        <div onClick={()=>setPick(null)} style={{position:'fixed',inset:0,
          background:'rgba(15,23,42,.5)',zIndex:999,display:'flex',alignItems:'center',
          justifyContent:'center',backdropFilter:'blur(5px)'}}>
          <div onClick={e=>e.stopPropagation()} style={{background:'#fff',borderRadius:18,
            padding:24,width:720,maxWidth:'94vw',maxHeight:'86vh',overflowY:'auto'}}>
            <div style={{fontSize:16,fontWeight:800,marginBottom:4}}>{pick.label}</div>
            <div style={{fontSize:12,color:'#94a3b8',marginBottom:16}}>
              The records behind this point</div>
            {raw.length===0
              ? <div style={{color:'#94a3b8',fontSize:13,padding:'20px 0'}}>No detail rows.</div>
              : <table style={{width:'100%',borderCollapse:'collapse',fontSize:11.5}}>
                  <thead><tr>{Object.keys(raw[0]).slice(0,8).map(k=>(
                    <th key={k} style={{textAlign:'left',padding:'7px 8px',
                      borderBottom:'2px solid #e2e8f0',color:'#64748b',fontSize:10,
                      textTransform:'uppercase'}}>{k.replace(/_/g,' ')}</th>))}</tr></thead>
                  <tbody>{raw.slice(0,120).map((r,i)=>(
                    <tr key={i}>{Object.keys(raw[0]).slice(0,8).map(k=>(
                      <td key={k} style={{padding:'6px 8px',
                        borderBottom:'1px solid #f1f5f9'}}>{String(r[k]??'')}</td>))}</tr>
                  ))}</tbody>
                </table>}
            {raw.length>120&&<div style={{fontSize:11,color:'#94a3b8',marginTop:10}}>
              showing first 120 of {raw.length}</div>}
            <button onClick={()=>setPick(null)} style={{marginTop:16,width:'100%',
              padding:'11px',borderRadius:10,border:'1.5px solid #e2e8f0',background:'#fff',
              fontSize:13,fontWeight:700,cursor:'pointer'}}>Close</button>
          </div>
        </div>
      )}

      {/* ---------------- alert editor ---------------- */}
      {editAlert&&(
        <div onClick={()=>setEditAlert(null)} style={{position:'fixed',inset:0,
          background:'rgba(15,23,42,.5)',zIndex:1000,display:'flex',alignItems:'center',
          justifyContent:'center',backdropFilter:'blur(5px)'}}>
          <div onClick={e=>e.stopPropagation()} style={{background:'#fff',borderRadius:18,
            padding:24,width:460,maxWidth:'94vw'}}>
            <div style={{fontSize:16,fontWeight:800,marginBottom:3}}>Corrective action</div>
            <div style={{fontSize:12,color:'#94a3b8',marginBottom:16}}>
              {editAlert.rule}{editAlert.part?' · '+editAlert.part:''}</div>
            <div style={{fontSize:11,fontWeight:700,color:'#64748b',textTransform:'uppercase',
              marginBottom:6}}>Owner</div>
            <input value={editAlert.owner||''}
              onChange={e=>setEditAlert({...editAlert,owner:e.target.value})}
              placeholder="Who is looking into this"
              style={{width:'100%',padding:'10px 12px',fontSize:13,border:'1.5px solid #e2e8f0',
                borderRadius:10,marginBottom:14,outline:'none'}}/>
            <div style={{fontSize:11,fontWeight:700,color:'#64748b',textTransform:'uppercase',
              marginBottom:6}}>Status</div>
            <div style={{display:'flex',gap:8,marginBottom:14}}>
              {['open','investigating','closed'].map(s=>(
                <button key={s} onClick={()=>setEditAlert({...editAlert,status:s})}
                  style={{flex:1,padding:'9px',borderRadius:9,
                    border:'1.5px solid '+(editAlert.status===s?'#2563eb':'#e2e8f0'),
                    background:editAlert.status===s?'#2563eb':'#fff',
                    color:editAlert.status===s?'#fff':'#64748b',fontSize:12,
                    fontWeight:700,cursor:'pointer',textTransform:'capitalize'}}>{s}</button>
              ))}
            </div>
            <div style={{fontSize:11,fontWeight:700,color:'#64748b',textTransform:'uppercase',
              marginBottom:6}}>What was done</div>
            <textarea value={editAlert.action_notes||''}
              onChange={e=>setEditAlert({...editAlert,action_notes:e.target.value})}
              placeholder="Cause found, action taken, result"
              style={{width:'100%',minHeight:90,padding:'10px 12px',fontSize:13,
                border:'1.5px solid #e2e8f0',borderRadius:10,marginBottom:16,
                outline:'none',resize:'vertical',lineHeight:1.5}}/>
            <div style={{display:'flex',gap:10}}>
              <button onClick={()=>setEditAlert(null)} style={{flex:1,padding:'12px',
                borderRadius:10,border:'1.5px solid #e2e8f0',background:'#fff',
                fontSize:13,fontWeight:700,cursor:'pointer'}}>Cancel</button>
              <button onClick={()=>saveAlert(editAlert)} style={{flex:2,padding:'12px',
                borderRadius:10,border:'none',
                background:'linear-gradient(135deg,#16a34a,#15803d)',color:'#fff',
                fontSize:13,fontWeight:800,cursor:'pointer'}}>Save</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const[lang,setLang]=useState('en');
  const[view,setView]=useState('schedule');
  const[selDate,setSelDateRaw]=useState(todayStr);
  const[selShift,setSelShift]=useState(1);
  const[weekStart,setWeekStart]=useState(()=>getMonday(todayStr()));
  const[schedData,setSchedData]=useState({});
  const[jobPhotos,setJobPhotos]=useState({});
  const[photoIndex,setPhotoIndex]=useState({});
  const[history,setHistory]=useState([]);
  const[jobQueue,setJobQueue]=useState([]);
  const[loading,setLoading]=useState(true);
  const[saveState,setSaveState]=useState('idle');
  const[photoModal,setPhotoModal]=useState(null);
  const[haasLive,setHaasLive]=useState({});
  const[roster,setRoster]=useState([]);
  const[parts,setParts]=useState([]);
  const[rosterLoading,setRosterLoading]=useState(true);
  const[showRosterPick,setShowRosterPick]=useState(false);
  const saveTimer=useRef(null);
  const prevDate=useRef(selDate);
  const syncTimer=useRef({});
  const t=LANG[lang];
  const weekDays=useMemo(()=>getWeekDays(weekStart),[weekStart]);
  const sc=SC[selShift-1];

  const migrateSt=sts=>{const out={};Object.keys(sts||{}).forEach(id=>{const v=sts[id];out[id]=v.workerId&&!v.worker1Id?{...blankSt(),...v,worker1Id:v.workerId,worker2Id:v.worker2Id||''}:{...blankSt(),...v};});return out;};

  const cur=useMemo(()=>schedData[selDate]&&schedData[selDate][selShift]?schedData[selDate][selShift]:blankShift(),[schedData,selDate,selShift]);
  const setCur=useCallback(fn=>setSchedData(prev=>{const d=prev[selDate]||{},c=d[selShift]||blankShift(),n=typeof fn==='function'?fn(c):fn;return{...prev,[selDate]:{...d,[selShift]:n}};}),[selDate,selShift]);

  const loadWeek=useCallback(async()=>{
    setLoading(true);
    try{
      const{data}=await sb.from('shift_schedules').select('*').in('shift_date',weekDays);
      const nd={};
      if(data)data.forEach(r=>{
        if(!nd[r.shift_date])nd[r.shift_date]={};
        const defSt={};ALL.forEach(id=>defSt[id]=blankSt());
        nd[r.shift_date][r.shift_number]={workers:r.workers||[],stations:{...defSt,...migrateSt(r.stations)},notes:r.notes||'',lead:r.lead||'',supervisor:r.supervisor||''};
      });
      setSchedData(prev=>({...prev,...nd}));
    }catch(e){console.error(e);}
    setLoading(false);
  },[weekDays]);

  /* Photos are base64 and can run to many megabytes. Loading all of them before
     the page can draw was what made this slow. So: fetch just the list of job
     numbers that HAVE a photo (tiny), and pull the actual images only for the
     jobs on screen. */
  const loadPhotoIndex=useCallback(async()=>{
    const{data}=await sb.from('job_photos').select('job_number');
    const s={};if(data)data.forEach(r=>{s[r.job_number]=true;});
    setPhotoIndex(s);
  },[]);

  const fetchPhotos=useCallback(async(jobNumbers)=>{
    const want=(jobNumbers||[]).filter(j=>j&&photoIndex[j]&&!jobPhotos[j]);
    if(!want.length) return;
    const{data}=await sb.from('job_photos')
      .select('job_number,photo_data').in('job_number',want.slice(0,30));
    if(!data||!data.length) return;
    setJobPhotos(prev=>{
      const m={...prev};
      data.forEach(r=>{ if(r.photo_data) m[r.job_number]=r.photo_data; });
      return m;
    });
  },[photoIndex,jobPhotos]);

  const loadPhotos=loadPhotoIndex;

  const loadHistory=useCallback(async()=>{
    const past=getPast3Days();
    const{data}=await sb.from('job_history').select('*').in('shift_date',past);
    const g={};
    if(data)data.forEach(r=>{
      if(!g[r.shift_date])g[r.shift_date]={};
      const defSt={};ALL.forEach(id=>defSt[id]=blankSt());
      g[r.shift_date][r.shift_number]={workers:r.workers||[],stations:{...defSt,...migrateSt(r.stations)},notes:r.notes||'',lead:r.lead||'',supervisor:r.supervisor||''};
    });
    setHistory(past.filter(d=>g[d]).map(d=>({date:d,shifts:g[d]})));
  },[]);

  const loadJobQueue=useCallback(async()=>{
    const{data,error}=await sb.from('job_queue').select('*').order('created_at',{ascending:false}).limit(400);
    if(!error&&data)setJobQueue(data);
  },[]);

  useEffect(()=>{loadWeek();},[loadWeek]);
  useEffect(()=>{loadPhotos();},[loadPhotos]);
  useEffect(()=>{loadHistory();},[loadHistory]);
  useEffect(()=>{loadJobQueue();},[loadJobQueue]);

  var fetchHaas=useCallback(function(){
    sb.from('haas_live').select('*')
      .then(function(res){
        var map={};
        (res.data||[]).forEach(function(r){map[r.machine_id]=r;});
        setHaasLive(map);
      })
      .catch(function(e){});
  },[]);
  useEffect(function(){
    fetchHaas();
    var hiv=setInterval(fetchHaas,10000);
    return function(){clearInterval(hiv);};
  },[fetchHaas]);
  var[shiftHistory,setShiftHistory]=useState([]);
  var fetchShiftHistory=useCallback(function(){
    sb.from('haas_shift_history').select('*').order('shift_date',{ascending:false}).order('shift_number',{ascending:false}).limit(60)
      .then(function(res){setShiftHistory(res.data||[]);})
      .catch(function(e){});
  },[]);
  useEffect(function(){
    fetchShiftHistory();
    var iv=setInterval(fetchShiftHistory,60000);
    return function(){clearInterval(iv);};
  },[fetchShiftHistory]);

  useEffect(()=>{
    const ch=sb.channel('mach-v4').on('postgres_changes',{event:'*',schema:'public',table:'shift_schedules'},payload=>{
      const r=payload.new;if(!r)return;
      const defSt={};ALL.forEach(id=>defSt[id]=blankSt());
      setSchedData(prev=>({...prev,[r.shift_date]:{...(prev[r.shift_date]||{}),[r.shift_number]:{workers:r.workers||[],stations:{...defSt,...migrateSt(r.stations)},notes:r.notes||'',lead:r.lead||'',supervisor:r.supervisor||''}}}));
    }).subscribe();
    const ch2=sb.channel('queue-v1').on('postgres_changes',{event:'*',schema:'public',table:'job_queue'},()=>{loadJobQueue();}).subscribe();
    return()=>{sb.removeChannel(ch);sb.removeChannel(ch2);};
  },[loadJobQueue]);

  const manualSave=useCallback(async()=>{
    const s=schedData[selDate]&&schedData[selDate][selShift]?schedData[selDate][selShift]:blankShift();
    setSaveState('saving');
    try{
      await sb.from('shift_schedules').upsert({shift_date:selDate,shift_number:selShift,workers:s.workers,stations:s.stations,notes:s.notes,lead:s.lead||'',supervisor:s.supervisor||''},{onConflict:'shift_date,shift_number'});
      setSaveState('saved');clearTimeout(saveTimer.current);saveTimer.current=setTimeout(()=>setSaveState('idle'),2500);
    }catch(e){console.error(e);setSaveState('idle');}
  },[schedData,selDate,selShift]);

  const setSelDate=useCallback(async nd=>{
    const old=prevDate.current;
    if(old!==nd&&schedData[old]){
      const rows=Object.entries(schedData[old]).map(([sn,s])=>({shift_date:old,shift_number:parseInt(sn),workers:s.workers,stations:s.stations,notes:s.notes,lead:s.lead||'',supervisor:s.supervisor||''}));
      await sb.from('job_history').upsert(rows,{onConflict:'shift_date,shift_number'});
      loadHistory();
    }
    prevDate.current=nd;setSelDateRaw(nd);
  },[schedData,loadHistory]);

  const loadParts=useCallback(()=>{
    sb.from('parts').select('*').eq('active',true)
      .order('times_used',{ascending:false}).limit(2000)
      .then(res=>setParts(res.data||[]))
      .catch(()=>{});
  },[]);
  useEffect(()=>{loadParts();},[loadParts]);

  const loadRoster=useCallback(()=>{
    setRosterLoading(true);
    sb.from('workers').select('*').order('name',{ascending:true})
      .then(res=>{setRoster(res.data||[]);setRosterLoading(false);})
      .catch(()=>setRosterLoading(false));
  },[]);
  useEffect(()=>{loadRoster();},[loadRoster]);

  /* put an existing roster person onto this shift */
  const pickWorker=(w)=>setCur(s=>{
    if(s.workers.length>=10) return s;
    if(s.workers.some(x=>x.id===w.id)) return s;
    return {...s,workers:[...s.workers,{id:w.id,name:w.name}]};
  });

  /* brand new person: save to shared roster, then put on this shift */
  const newRosterWorker=(name,done)=>{
    const row={id:`${Date.now()}${Math.floor(Math.random()*10000)}`,name:name,active:true};
    sb.from('workers').insert([row])
      .then(res=>{
        if(res&&res.error){ if(done)done(); return; }
        setRoster(p=>[...p,row]);
        pickWorker(row);
        if(done)done();
      })
      .catch(()=>{ if(done)done(); });
  };

  const addWorker=()=>setShowRosterPick(true);
  const removeWorker=wi=>setCur(s=>{const rid=s.workers[wi]?s.workers[wi].id:null;const ns=Object.fromEntries(Object.entries(s.stations).map(([k,v])=>[k,v.worker1Id===rid?{...v,worker1Id:''}:v.worker2Id===rid?{...v,worker2Id:''}:v]));return{...s,workers:s.workers.filter((_,j)=>j!==wi),stations:ns};});
  const setName=(wi,nm)=>setCur(s=>({...s,workers:s.workers.map((w,j)=>j===wi?{...w,name:nm}:w)}));
  const setStn=(sid,f,v)=>{
    setCur(s=>({...s,stations:{...s.stations,[sid]:{...s.stations[sid],[f]:v}}}));
    // ── Sync schedule production → planning (debounced 700ms to avoid per-keystroke duplicates) ──
    if(f==='partsActual'||f==='partsTarget'){
      const st=cur.stations[sid]||{};
      const jobNum=(st.job||'').trim();
      if(jobNum){
        const timerKey=sid+'_'+f;
        clearTimeout(syncTimer.current[timerKey]);
        syncTimer.current[timerKey]=setTimeout(()=>{
          // Read latest jobQueue state inside setJobQueue updater to avoid stale closure
          setJobQueue(prev=>{
            const match=prev.find(j=>j.job_number===jobNum);
            if(match){
              const upd=f==='partsActual'?{parts_done:v}:{quantity:v};
              sb.from('job_queue').update(upd).eq('id',match.id);
              return prev.map(j=>j.id===match.id?{...j,...upd}:j);
            } else {
              // Auto-create a single planning job after user finishes typing
              const newJob={
                job_number:jobNum,
                part_name:jobNum,
                quantity:f==='partsTarget'?v:(st.partsTarget||0),
                parts_done:f==='partsActual'?v:(st.partsActual||0),
                machine_id:sid,
                priority:'medium',
                kanban_status:'running',
                planned_date:selDate,
                planned_shift:selShift,
                notes:'',
              };
              sb.from('job_queue').insert([newJob]).select().then(({data,error})=>{
                if(!error&&data&&data[0])setJobQueue(pv=>[data[0],...pv]);
              });
              return prev; // unchanged until insert resolves
            }
          });
        },700);
      }
    }
  };

    const job=jobQueue.find(j=>j.id===id);
    setJobQueue(prev=>prev.map(j=>j.id===id?{...j,...changes}:j));
    await sb.from('job_queue').update(changes).eq('id',id);

    if(job){
      const stationUpdates={};
      if('parts_done' in changes) stationUpdates.partsActual=changes.parts_done;
      if('quantity'   in changes) stationUpdates.partsTarget=changes.quantity;
      if(Object.keys(stationUpdates).length>0){
        const jn=job.job_number&&job.job_number.trim();
        if(jn){
          setCur(s=>{
            const ns={...s.stations};
            Object.entries(s.stations).forEach(([sid,st])=>{
              if(st.job&&st.job.trim()===jn) ns[sid]={...ns[sid],...stationUpdates};

            return{...s,stations:ns};
          });
        }
      }
    }
  };
  const deleteJobFromQueue=async(id)=>{

  const prodSummary=useMemo(()=>{

    const totalScrapped=stations.reduce((s,v)=>s+(v.scrapped||0),0);

  },[cur.stations]);

  const NAV_TABS=[

      <div style={{fontSize:13,color:'#94a3b8'}}>Loading...</div>
    </div>

    const stamps=Object.values(haasLive||{})
      .map(r=>r&&r.last_update?new Date(r.last_update).getTime():0)
      .filter(t=>t>0);
    if(!stamps.length) return null;
    const newest=Math.max(...stamps);
    const mins=Math.floor((Date.now()-newest)/60000);
    return mins>=5 ? {mins, at:new Date(newest)} : null;

          <span style={{fontSize:19}}>&#128268;</span>

              Nothing recorded for {bridgeQuiet.mins<60

                  ? Math.round(bridgeQuiet.mins/60)+' hours'
                  : Math.round(bridgeQuiet.mins/1440)+' days'}.

            <div>
              <div style={{fontSize:19,fontWeight:900,color:'#0f172a'}}>{t.jobQueue}</div>
              <div style={{fontSize:11,color:'#94a3b8',marginTop:1}}>{jobQueue.length} jobs total · {jobQueue.filter(j=>j.kanban_status!=='complete').length} active</div>

              {weekDays.map((day,i)=>{
                const isToday=day===todayStr(),isAct=day===selDate;

                return(
                  <button key={day} onClick={()=>setSelDate(day)}
                    style={{border:'none',borderBottom:`3px solid ${isAct?sc.main:'transparent'}`,background:isAct?sc.light:'none',padding:'9px 18px',cursor:'pointer',color:isAct?sc.main:'#64748b',fontWeight:isAct?800:500,fontSize:13,display:'flex',flexDirection:'column',alignItems:'center',gap:2,transition:'all 0.15s',minWidth:90}}>
                    <span style={{display:'flex',alignItems:'center',gap:5}}>
                      {t.days[i]}
                      {isToday&&<span style={{fontSize:8,background:sc.grad,color:'#fff',padding:'2px 6px',borderRadius:8,fontWeight:900}}>{t.today}</span>}
                    </span>
                    <span style={{fontSize:10,color:isAct?sc.main+'cc':'#475569',fontWeight:500}}>{fmtDate(day,lang)}</span>
                    {tot>0&&<div style={{width:6,height:6,borderRadius:'50%',background:sc.main}}/>}
                  </button>
                );
              })}
              <button onClick={()=>{const d=new Date(weekStart+'T12:00:00');d.setDate(d.getDate()+7);setWeekStart(d.toISOString().slice(0,10));}}
                style={{padding:'9px 14px',border:'none',borderBottom:'3px solid transparent',background:'none',color:'#94a3b8',fontSize:12,cursor:'pointer',fontWeight:700}}>{t.nextWeek}</button>
            </div>

                  {t.reset}

          <div style={{maxWidth:1600,margin:'0 auto',padding:'18px 22px 32px',display:'grid',gridTemplateColumns:'260px 1fr',gap:18}}>

<script>
/* =====================================================================
   COMPILE CACHE
   The app is written in JSX, which the browser cannot run directly.
   Normally that means downloading Babel (2.4 MB) and compiling the whole
   app on EVERY page load.

   Instead: compile once, keep the result in this browser, and on every
   later visit run the cached JavaScript directly - Babel is never even
   fetched. If the app source changes the key changes and it recompiles
   once, automatically.
   ===================================================================== */
(function(){
  var SRC_ID   = 'app-src';
  var BABEL_URL= 'https://unpkg.com/@babel/standalone@7.23.6/babel.min.js';
  var STORE    = 'nidc_web_compiled_v1';
  var KEYNAME  = 'nidc_web_compiled_key_v1';

  function setMsg(t){ var e=document.getElementById('boot-msg'); if(e) e.textContent=t; }
  function setBar(p){ var e=document.getElementById('boot-bar'); if(e) e.style.width=p+'%'; }

  function hash(s){
    var h=5381, i=s.length;
    while(i) h=(h*33) ^ s.charCodeAt(--i);
    return (h>>>0).toString(36) + '_' + s.length.toString(36);
  }

  function run(code){
    try{
      var s=document.createElement('script');
      s.textContent=code;
      document.body.appendChild(s);
      return true;
    }catch(e){ console.error('run failed',e); return false; }
  }

  function fail(msg,detail){
    setMsg(msg);
    var d=document.getElementById('error-display');
    if(d){
      d.style.display='block';
      var dd=document.getElementById('error-detail');
      if(dd) dd.textContent=detail||msg;
    }
    if(window.__bootDone) window.__bootDone();
  }

  function compileAndRun(src, key){
    setMsg('Preparing the app (first time only)');
    setBar(30);
    var s=document.createElement('script');
    s.src=BABEL_URL;
    s.onload=function(){
      setBar(55);
      /* let the progress bar paint before we block the thread compiling */
      setTimeout(function(){
        var code;
        try{
          code=Babel.transform(src,{presets:['react'],compact:false,comments:false}).code;
        }catch(e){
          console.error('compile failed',e);
          fail('Could not start the app','Compile error: '+e.message);
          return;
        }
        setBar(85);
        try{
          localStorage.setItem(STORE, code);
          localStorage.setItem(KEYNAME, key);
        }catch(e){ /* quota or private mode - fine, just will not cache */ }
        run(code);
      }, 30);
    };
    s.onerror=function(){
      fail('Could not reach the internet',
           'Could not download the compiler from unpkg.com. Check the connection, '+
           'or ask IT whether unpkg.com is blocked on this network.');
    };
    document.head.appendChild(s);
  }

  function boot(){
    var node=document.getElementById(SRC_ID);
    if(!node){ console.error('app source not found'); return; }
    var src=node.textContent;
    var key=hash(src);

    var cached=null, cachedKey=null;
    try{
      cachedKey=localStorage.getItem(KEYNAME);
      if(cachedKey===key) cached=localStorage.getItem(STORE);
    }catch(e){}

    if(cached){
      setMsg('Starting');
      setBar(70);
      if(run(cached)) return;        /* fast path: Babel never downloaded */
      try{ localStorage.removeItem(STORE); localStorage.removeItem(KEYNAME); }catch(e){}
    }
    compileAndRun(src, key);
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
